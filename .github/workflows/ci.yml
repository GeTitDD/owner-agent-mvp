# Minimal CI for owner-agent-mvp: syntax check, full deterministic test suite,
# and both demos (fake sessions only — no real model calls, no API keys needed).
name: CI

on:
  push:
    branches: [main]
  # Run for every pull request, including stacked PRs whose base is not main.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Cross-platform lock: worktree/path/symlink behaviour is exercised on both OSes.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run demo:jobs
      - run: npm run demo:pi
      - run: npm run demo:patch
      - run: npm run demo:sandbox
      - run: npm run demo:repair

  plugin:
    # Independent evidence for the OpenClaw feature plugin: pinned host version,
    # real build, manifest validation. No model calls and no network at runtime.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/openclaw-plugin/package-lock.json
      - name: Install pinned OpenClaw host
        working-directory: integrations/openclaw-plugin
        run: npm ci
      - name: Build plugin (tsc + control UI bundle)
        working-directory: integrations/openclaw-plugin
        run: npm run build
      - name: Validate manifest and UI assets
        working-directory: integrations/openclaw-plugin
        run: node node_modules/openclaw/openclaw.mjs plugins validate --json
      - name: Assert the model surface has no approval tools
        working-directory: integrations/openclaw-plugin
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("openclaw.plugin.json", "utf8"));
            const tools = [...(manifest.contracts?.tools ?? [])].sort();
            const expected = ["owner_job_submit", "owner_jobs_list", "owner_projects", "owner_status", "owner_tasks"];
            if (JSON.stringify(tools) !== JSON.stringify(expected)) {
              console.error("unexpected tool surface:", tools);
              process.exit(1);
            }
            if (/(approve|apply|repair|sandbox)/.test(tools.join(","))) {
              console.error("approval tool leaked into the model surface:", tools);
              process.exit(1);
            }
            console.log("model tool surface OK:", tools.join(", "));
          '

  sandbox-real:
    # The only job allowed to run project test code: inside a locked-down Linux container.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record Docker security options
        run: docker info --format 'rootless/security={{json .SecurityOptions}} cgroup={{.CgroupVersion}}'
      - run: docker pull node:22-alpine
      - name: Resolve trusted image digest
        run: |
          DIGEST=$(docker image inspect node:22-alpine --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "OWNER_AGENT_SANDBOX_IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "OWNER_AGENT_SANDBOX_TRUSTED_DIGESTS=$DIGEST" >> "$GITHUB_ENV"
      - name: Run real sandbox smoke and isolation probes
        run: OWNER_AGENT_SANDBOX_REAL=1 npm run test:sandbox:real
      - name: List sandbox-labelled containers for evidence
        if: always()
        run: docker ps -a --filter label=owner.sandbox=1

  desktop-package:
    # Windows RC artifact: downloadable only through the private repo's Actions.
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      ARTIFACT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows portable
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run desktop:pack
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "desktop:pack failed on attempt $attempt; retrying"
            Start-Sleep -Seconds 15
          }
          exit 1
      - name: Monty packaged smoke
        # 验证 asarUnpack 后的 monty.exe 在打包产物内可运行（win-unpacked 由 portable 构建生成）
        shell: pwsh
        run: |
          if (Test-Path dist-companion/win-unpacked/Owner Companion.exe) {
            node scripts/e2e/monty-packaged-smoke.mjs --no-build
          } else {
            Write-Host "SKIP: dist-companion/win-unpacked not produced by portable build"
          }
      - name: Write SHA256 and commit
        shell: pwsh
        run: |
          $exe = Get-Item dist-companion/OwnerCompanion-1.0.0-portable.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          @(
            "$hash  $($exe.Name)",
            "commit=$env:ARTIFACT_COMMIT",
            "run=${{ github.run_id }}"
          ) | Set-Content -Encoding ascii dist-companion/SHA256SUMS.txt
          Get-Content dist-companion/SHA256SUMS.txt
          "### Windows portable RC" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "commit: ``$env:ARTIFACT_COMMIT``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "sha256: ``$hash``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: OwnerCompanion-1.0.0-portable-${{ env.ARTIFACT_COMMIT }}
          path: |
            dist-companion/OwnerCompanion-1.0.0-portable.exe
            dist-companion/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
