# Minimal CI for owner-agent-mvp: syntax check, full deterministic test suite,
# and both demos (fake sessions only — no real model calls, no API keys needed).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Cross-platform lock: worktree/path/symlink behaviour is exercised on both OSes.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run demo:jobs
      - run: npm run demo:pi
      - run: npm run demo:patch
