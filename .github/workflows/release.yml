# 发布：打 tag 时构建 Windows 便携版并创建 Release。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build portable
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run desktop:pack
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "desktop:pack failed on attempt $attempt; retrying"
            Start-Sleep -Seconds 15
          }
          exit 1
      - name: Checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = Get-Item "dist-companion/OwnerCompanion-$version-portable.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          @("$hash  $($exe.Name)", "tag=${{ github.ref_name }}", "commit=${{ github.sha }}") |
            Set-Content -Encoding ascii dist-companion/SHA256SUMS.txt
          Get-Content dist-companion/SHA256SUMS.txt
      - name: Create release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $notes = @(
            "便携版：解压即用；数据在 %APPDATA%\owner-agent-mvp。",
            "本次构建来源：${{ github.sha }}",
            "校验：见 SHA256SUMS.txt"
          ) -join "`n"
          gh release create "${{ github.ref_name }}" `
            "dist-companion/OwnerCompanion-$version-portable.exe" `
            "dist-companion/SHA256SUMS.txt" `
            --title "Owner Companion ${{ github.ref_name }}" `
            --notes $notes
