name: Feature request
description: 提一个要解决的问题（不是先给实现方案）
title: "[feat] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        这个产品有明确的方向性约束：观察层只读、写入按目的地分级、单入口卡片。
        提方案前请先读 CONTRIBUTING.md 与 `docs/adr/`。
  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题
      description: 描述场景与现在的阻碍，不要直接写「加一个按钮」。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你倾向的做法
      description: 可以留空；有的话请说明它为什么不破坏只读与确认边界。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 大致范围
      options:
        - 只影响本机自有数据
        - 会读项目目录
        - 会写项目目录（需要确认）
        - 会外发（需要确认）
        - 不确定
    validations:
      required: true
