<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Owner Companion</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .bubble {
    margin: 4px; padding: 10px 12px; border-radius: 12px;
    background: #ffffff; color: #262626; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.18), 0 0 0 1px rgba(38,38,38,.08);
  }
  @media (prefers-color-scheme: dark) {
    .bubble { background: #2c2c2a; color: #e8e8e6; box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1); }
  }
  .kicker { font-size: 10px; letter-spacing: .8px; opacity: .55; text-transform: uppercase; }
  .title { margin-top: 4px; font-size: 13px; font-weight: 650; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: 4px; font-size: 11px; opacity: .6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="bubble" id="bubble" hidden>
    <div class="kicker" id="kicker">待你决定</div>
    <div class="title" id="title"></div>
    <div class="meta" id="meta"></div>
  </div>
  <script src="./bubble.js"></script>
</body>
</html>
