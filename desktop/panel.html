<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Owner Companion</title>
  <link rel="stylesheet" href="./panel.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="state-dot" id="stateDot"></span>
        <div>
          <strong>Owner Companion</strong>
          <small id="stateText">空闲</small>
        </div>
      </div>
      <div class="header-actions">
        <button id="openFull" class="ghost" title="打开完整工作台">完整工作台</button>
        <button id="openSettings" class="ghost" title="设置">设置</button>
        <button id="hidePanel" class="ghost" title="收起">×</button>
      </div>
    </header>

    <div class="scroll">
      <section class="activity-card" id="activityCard">
        <div class="activity-head">
          <span id="activityPhase" class="state-dot"></span>
          <span id="activityLabel" class="activity-state">空闲</span>
          <span class="activity-meta">
            <span id="workerLabel">Worker 空闲</span>
            <span id="pendingCount">0 项待决定</span>
          </span>
        </div>
        <div class="activity-stage" id="stage">正在读取状态…</div>
        <div id="activityLines" class="activity-lines"></div>
      </section>

      <section id="setup" class="setup" hidden>
        <h3>先添加一个项目</h3>
        <p>选择本地 Git 仓库目录。桌宠会从这里读取项目并创建任务；L1 不依赖 OpenClaw，完整工作台才需要它。</p>
        <div id="setupServices" class="service-grid"></div>
        <button id="addProject" class="primary">选择项目目录</button>
      </section>

      <section id="timelineSection" class="timeline-section" hidden>
        <div class="section-title">
          <h3>会话</h3>
          <span id="timelineCount" class="count">0</span>
        </div>
        <div id="timeline" class="timeline-list"></div>
      </section>

      <section id="playbookSection" class="playbook-section" hidden>
        <div class="section-title">
          <h3>项目 Playbook</h3>
          <span id="playbookBadge" class="count">pstack</span>
        </div>
        <div id="playbookHintRow" class="playbook-hint-row">
          <span id="playbookHint" class="playbook-hint">一键只读分析当前项目；改动会先生成提案等你批准。</span>
          <button id="playbookCancel" class="ghost small" hidden>取消</button>
        </div>
        <div id="playbookGroups" class="playbook-groups"></div>
        <div id="playbookResult" class="playbook-result" hidden></div>
      </section>

      <section class="knowledge-section">
        <div class="section-title">
          <h3>知识</h3>
          <span id="knowledgeBadge" class="count">0</span>
        </div>
        <div class="knowledge-quick">
          <button type="button" data-knowledge="today">今天学到什么</button>
          <button type="button" data-knowledge="project">本项目经验</button>
          <button type="button" data-knowledge="similar">类似问题</button>
          <button type="button" data-knowledge="verified">验证与复用</button>
        </div>
        <div id="knowledgeSummaryText" class="knowledge-summary">正在读取知识库…</div>
        <div class="knowledge-actions">
          <button id="harvestNow" class="primary small" title="把当前项目的待提炼经验提炼成待审核候选">立即提炼</button>
          <button id="openKnowledge" class="ghost small">完整知识库</button>
        </div>
      </section>

      <section>
        <div class="section-title">
          <h3>需要你决定</h3>
          <span id="pendingBadge" class="count">0</span>
        </div>
        <div id="pendingList" class="pending-list"></div>
      </section>

      <section id="resultSection" hidden>
        <div class="section-title"><h3>最近结果</h3></div>
        <div id="resultCard" class="result-card"></div>
      </section>
    </div>

    <section class="composer-dock" id="composeSection">
      <div class="composer-card">
        <div class="composer-head">
          <select id="projectSelect" aria-label="项目"></select>
          <button id="openFullInline" class="ghost small" title="完整工作台">工作台</button>
        </div>
        <textarea id="taskInput" rows="1" maxlength="1200"
          placeholder="交办一件事…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="composer-bar">
          <span id="composerModel" class="composer-model" title="当前模型">—</span>
          <span class="composer-hint">先创建任务，批准后执行</span>
          <button id="submitTask" class="send-btn" title="发送（Enter）" aria-label="发送">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div id="testWarning" class="test-warning" hidden>
          <span id="testWarningText"></span>
          <select id="sandboxModeSelect" class="mode-select" aria-label="本项目的沙箱测试">
            <option value="auto">自动</option>
            <option value="off">关闭</option>
            <option value="node-smoke">Node</option>
          </select>
          <button id="fixTestConfig" class="ghost small">配置</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span id="footerStatus">本地服务已启动</span>
      <button id="quit" class="link">退出</button>
    </footer>
  </div>

  <div id="settings" class="overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2>设置</h2>
        <button id="closeSettings" class="ghost">×</button>
      </div>
      <div class="sheet-body">
        <label class="field">
          <span>OpenClaw Gateway 地址</span>
          <input id="gatewayUrl" placeholder="http://127.0.0.1:18789" />
        </label>
        <label class="field">
          <span>模型（留空使用 Pi 默认）</span>
          <input id="model" placeholder="provider/model" />
        </label>
        <label class="field">
          <span>沙箱测试默认策略（按项目可覆盖）</span>
          <select id="sandboxMode" aria-label="沙箱测试默认策略">
            <option value="auto">自动：Node 项目启用，其它生态跳过</option>
            <option value="off">关闭：一律跳过，只做人工验证</option>
            <option value="node-smoke">强制 Node：任何项目都按 node-smoke 预检</option>
          </select>
        </label>
        <div class="field">
          <span>桌宠皮肤（Codex 阶段兼容；把 PNG 放进 userData\mascots 即可自定义）</span>
          <div id="mascotGrid" class="mascot-grid"></div>
        </div>
        <label class="checkbox-row">
          <input id="knowledgeAutoHarvest" type="checkbox" />
          <span>自动提炼知识（会调用模型；关闭时只自动采集经验并进入待提炼队列）</span>
        </label>
        <label class="field">
          <span>允许修改的路径</span>
          <input id="allowedPaths" placeholder="src/" />
        </label>
        <label class="field">
          <span>沙箱快照额外包含的文件（逗号分隔；node-smoke 会自动包含 tests/sandbox-smoke.test.mjs）</span>
          <input id="includePaths" placeholder="package.json" />
        </label>
        <div class="service-grid" id="serviceGrid"></div>
        <div class="sheet-actions">
          <button id="saveSettings" class="primary">保存</button>
          <button id="retryServices" class="ghost">重新检测</button>
          <button id="addProjectSettings" class="ghost">添加项目</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal" class="overlay" hidden>
    <div class="sheet modal-sheet">
      <div class="sheet-head">
        <h2 id="modalTitle">详情</h2>
        <button id="closeModal" class="ghost">×</button>
      </div>
      <div class="sheet-body" id="modalBody"></div>
      <div class="sheet-foot" id="modalFoot"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="./composer-list.js"></script>
  <script src="./panel.js"></script>
</body>
</html>
