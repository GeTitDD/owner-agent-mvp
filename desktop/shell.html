<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Owner Companion · 卡片</title>
  <!-- #105 卡片壳：单列布局（顶栏一行 / 中部对话流 / 底部输入框）。
       这一版是新旧并存的 expand 步骤：旧面板整页原样保留，默认仍走它；
       主进程用 OWNER_AGENT_SHELL=1 或 --shell 才加载这一页。 -->
  <link rel="stylesheet" href="./shell.css" />
</head>
<body>
  <div class="shell">
    <!-- 顶栏只放状态位：#105 定了五个位置；#106 只把「会话」这一个位从占位换成入口
         （胶囊 + 一个浮层），其余四位仍是占位。浮层里承载列表/搜索/新建/重命名/置顶/删除，
         所以顶栏本身没有多出第二个按钮。 -->
    <header class="top" id="shellHeader">
      <div class="session-entry">
        <button type="button" class="capsule" id="sessionToggle" data-slot="session"
                aria-haspopup="dialog" aria-expanded="false" title="会话">
          <span class="slot-key">会话</span>
          <span class="slot-value" id="sessionLabel">还没有会话</span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
        <div class="sessions" id="sessionPopover" role="dialog" aria-label="会话列表" hidden>
          <div class="sessions-head">
            <input type="search" id="sessionSearch" placeholder="搜索会话标题" autocomplete="off" />
            <button type="button" class="sessions-new" id="sessionNew">新建</button>
          </div>
          <p class="sessions-hint" id="sessionListHint" hidden></p>
          <ul class="sessions-list" id="sessionList"></ul>
          <div class="sessions-foot">
            <button type="button" class="sessions-archive" id="sessionArchive" aria-pressed="false">
              已删除 0
            </button>
            <span class="sessions-error" id="sessionError" role="status" hidden></span>
          </div>
        </div>
      </div>
      <span class="slot" data-slot="project">
        <span class="slot-key">项目</span>
        <span class="slot-value">占位</span>
      </span>
      <span class="slot" data-slot="write">
        <span class="slot-key">写范围</span>
        <span class="slot-value">占位</span>
      </span>
      <span class="slot" data-slot="monitor">
        <span class="slot-key">监控</span>
        <span class="slot-value">占位</span>
      </span>
      <span class="slot" data-slot="export">
        <span class="slot-key">导出</span>
        <span class="slot-value">占位</span>
      </span>
    </header>

    <main class="thread" id="thread">
      <p class="empty" id="emptyState">还没有会话。点顶栏的「会话」新建一个。</p>
      <ol class="messages" id="messages"></ol>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="input">输入消息</label>
      <textarea id="input" rows="1" placeholder="说点什么。回车发送，Shift+回车换行"></textarea>
      <button type="submit" class="send" id="send" disabled>发送</button>
    </form>
  </div>

  <script src="./shell-thread.cjs"></script>
  <script src="./shell-sessions.cjs"></script>
  <!-- #113 风险评级与确认卡：先于块渲染加载，块归一化要直接读它的纯函数。 -->
  <script src="./risk-card.cjs"></script>
  <script src="./shell-blocks.cjs"></script>
  <script src="./shell-blocks-view.js"></script>
  <script src="./shell.js"></script>
</body>
</html>
