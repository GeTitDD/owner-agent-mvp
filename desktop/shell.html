<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Owner Companion · 卡片</title>
  <!-- #105 卡片壳：单列布局（顶栏一行 / 中部对话流 / 底部输入框）。
       这一版是新旧并存的 expand 步骤：旧面板整页原样保留，默认仍走它；
       主进程用 OWNER_AGENT_SHELL=1 或 --shell 才加载这一页。 -->
  <link rel="stylesheet" href="./shell.css" />
</head>
<body>
  <div class="shell">
    <!-- 顶栏只放状态位：#105 定了五个位置。#106 把「会话」做成入口（胶囊 + 浮层），
         #107 把「项目」也做成入口（全局 / 已登记项目 + 切换确认），写范围改由 gate 文案回答；
         监控与导出仍是状态位，顶栏不变成第二个菜单。 -->
    <header class="top" id="shellHeader">
      <div class="session-entry">
        <button type="button" class="capsule" id="sessionToggle" data-slot="session"
                aria-haspopup="dialog" aria-expanded="false" title="会话">
          <span class="slot-key">会话</span>
          <span class="slot-value" id="sessionLabel">还没有会话</span>
          <span class="cross-mark" id="sessionCross" hidden>跨项目</span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
        <div class="sessions" id="sessionPopover" role="dialog" aria-label="会话列表" hidden>
          <div class="sessions-head">
            <input type="search" id="sessionSearch" placeholder="搜索会话标题" autocomplete="off" />
            <button type="button" class="sessions-new" id="sessionNew">新建</button>
          </div>
          <p class="sessions-hint" id="sessionListHint" hidden></p>
          <ul class="sessions-list" id="sessionList"></ul>
          <div class="sessions-foot">
            <button type="button" class="sessions-archive" id="sessionArchive" aria-pressed="false">
              已删除 0
            </button>
            <span class="sessions-error" id="sessionError" role="status" hidden></span>
          </div>
        </div>
      </div>
      <div class="project-entry">
        <button type="button" class="capsule" id="projectToggle" data-slot="project"
                aria-haspopup="dialog" aria-expanded="false" title="项目：不选就是全局（只读）">
          <span class="slot-key">项目</span>
          <span class="slot-value" id="projectLabel">全局</span>
          <span class="caret" aria-hidden="true">▾</span>
        </button>
        <div class="projects" id="projectPopover" role="dialog" aria-label="项目列表" hidden>
          <p class="projects-hint" id="projectHint">不选项目就是全局：读所有项目的记忆，不写入任何项目。</p>
          <ul class="projects-list" id="projectList"></ul>
        </div>
      </div>
      <span class="slot" data-slot="write">
        <span class="slot-key">写范围</span>
        <span class="slot-value" id="writeScope" data-scope="global">只读·全局</span>
      </span>
      <span class="slot" data-slot="monitor">
        <span class="slot-key">监控</span>
        <span class="slot-value">占位</span>
      </span>
      <span class="slot" data-slot="export">
        <span class="slot-key">导出</span>
        <span class="slot-value">占位</span>
      </span>
    </header>

    <main class="thread" id="thread">
      <!-- #107 全局模式：跨项目聚合只读视图。选项目后隐藏，回到对话流本身。 -->
      <section class="global-view" id="globalView" hidden aria-label="全局只读聚合">
        <div class="global-head">
          <span class="global-badge">只读</span>
          <span class="global-title" id="globalTitle">全局 · 跨项目记忆</span>
          <button type="button" class="global-refresh" id="globalRefresh">刷新</button>
        </div>
        <p class="global-hint" id="globalHint"></p>
        <p class="global-counts" id="globalCounts"></p>
        <p class="global-status" id="globalStatus" role="status"></p>
        <ul class="global-projects" id="globalProjects"></ul>
        <ul class="global-entries" id="globalEntries"></ul>
        <p class="global-empty" id="globalEmpty" hidden></p>
      </section>
      <p class="empty" id="emptyState">还没有会话。点顶栏的「会话」新建一个。</p>
      <ol class="messages" id="messages"></ol>
    </main>

    <!-- #124 关联项目：胶囊显示在输入框上方，可逐个移除；发送时进入 prompt 的
         「## 关联项目」段。跨项目只读那一句写在胶囊旁边，不靠用户猜。 -->
    <div class="link-bar" id="projectLinks" hidden aria-label="关联项目">
      <div class="link-capsules" id="projectLinkList"></div>
      <p class="link-hint" id="projectLinksHint"></p>
    </div>

    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="input">输入消息</label>
      <textarea id="input" rows="1" placeholder="说点什么。回车发送，Shift+回车换行"></textarea>
      <button type="submit" class="send" id="send" disabled>发送</button>
    </form>

    <!-- #108：输入 `/` 打开技能面板。上半是数字快捷（1-9，可改），
         下半是扫描出来的全部技能；两段共用一个滚动容器，页脚写键盘用法。 -->
    <div class="slash-panel" id="skillPanel" role="dialog" aria-label="技能面板" hidden>
      <div class="slash-head">
        <span class="slash-title">技能</span>
        <span class="slash-count" id="skillCount">读取中…</span>
        <button type="button" class="slash-link" id="skillAliasToggle" aria-pressed="false">自定义</button>
        <button type="button" class="slash-close" id="skillClose" aria-label="关闭技能面板">✕</button>
      </div>
      <div class="slash-scroll" id="skillList"></div>
      <p class="slash-hint" id="skillHint"></p>
      <p class="slash-warn" id="skillConflict" hidden></p>
      <p class="slash-error" id="skillError" role="status" hidden></p>
    </div>

    <!-- #122：输入 `@@` 打开方法菜单（小卡片，贴着输入框，不铺满窗口）。
         容器只提供外壳：标题 + 返回 + 关闭；菜单项由 shell-at.cjs 的方法数据逐行画，
         方法卡的内容由方法自己注册（#123 的「生成 prompt」已接上控件，其余仍是占位）。 -->
    <div class="at-panel" id="atPanel" role="dialog" aria-label="@@ 方法" hidden>
      <div class="at-head">
        <button type="button" class="at-back" id="atBack" aria-label="返回方法菜单" hidden>←</button>
        <b class="at-title" id="atTitle">@@ 要做什么</b>
        <span class="at-sub" id="atSub"></span>
        <button type="button" class="at-close" id="atClose" aria-label="关闭 @@ 面板">✕</button>
      </div>
      <div class="at-body" id="atBody"></div>
      <p class="at-hint" id="atHint"></p>
    </div>

    <!-- #110 导出会话：按钮放在输入框下面，不占顶栏。
         顶栏本轮仍是状态位（#105 的口径），把「导出」做成操作是后续票的事。 -->
    <div class="shell-actions">
      <button type="button" class="export-button" id="exportConversation">导出 Markdown</button>
      <span class="export-path" id="exportPath" hidden></span>
    </div>

    <!-- 复制/导出的可见回执：失败也走这里，不静默。 -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <!-- #107 切项目确认：四条后果固定写在弹窗里，两个出口并排；取消什么都不改。 -->
  <div class="confirm-backdrop" id="projectConfirm" hidden>
    <div class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">切换项目？</h2>
      <p class="confirm-target" id="confirmTarget"></p>
      <ul class="confirm-items" id="confirmItems"></ul>
      <p class="confirm-hint">
        「在本会话切换」保留历史归属、只改正在看与写入落点，会话会打「跨项目」标；
        「新开会话并切换」让会话与项目一致，从零开始。
      </p>
      <div class="confirm-actions">
        <button type="button" class="confirm-exit primary" id="confirmInSession">在本会话切换</button>
        <button type="button" class="confirm-exit" id="confirmNewSession">新开会话并切换</button>
        <button type="button" class="confirm-cancel" id="confirmCancel">取消</button>
      </div>
    </div>
  </div>

  <script src="./shell-thread.cjs"></script>
  <script src="./shell-sessions.cjs"></script>
  <script src="./shell-skills.cjs"></script>
  <script src="./shell-projects.cjs"></script>
  <!-- #113 风险评级与确认卡：先于块渲染加载，块归一化要直接读它的纯函数。 -->
  <script src="./risk-card.cjs"></script>
  <!-- #116 外发 / 删除确认卡：同样先于块渲染；window.OwnerConfirmCards 被块归一化直接读。 -->
  <script src="./confirm-cards.cjs"></script>
  <script src="./shell-blocks.cjs"></script>
  <script src="./shell-copy.cjs"></script>
  <script src="./shell-blocks-view.js"></script>
  <!-- #121 三块界面：顶栏 / 输入区 / 对话流；shell.js 只做装配与事件接线。 -->
  <script src="./shell-header.cjs"></script>
  <!-- #122 `@@` 方法菜单：先于输入区加载，输入区要用它的触发判定与面板实例。 -->
  <script src="./shell-at.cjs"></script>
  <!-- #123 「生成 prompt」方法：流内勾选、计数与四段组装；方法卡进入时才 mount。 -->
  <script src="./shell-at-prompt.cjs"></script>
  <!-- #124 「关联项目」方法：项目 → 资料的层级与输入框上方的胶囊；发送时拼 prompt 段。 -->
  <script src="./shell-at-project.cjs"></script>
  <script src="./shell-compose.cjs"></script>
  <script src="./shell-stream.cjs"></script>
  <script type="module" src="./card-scope-host.mjs"></script>
  <!-- #114 自有目录写入：判定与回执的纯函数在这里挂窗口（模块脚本，晚于上面的经典脚本）。 -->
  <script type="module" src="./own-write-host.mjs"></script>
  <!-- #116 外发 / 删除的脚本化入口：算计划、出卡片，命令与卡片共用一份判定。 -->
  <script type="module" src="./confirm-host.mjs"></script>
  <!-- #115 项目目录同步：判定 / 清单 / 会话授权 / 回执；挂窗口的同样是纯函数的薄壳。 -->
  <script type="module" src="./project-write-host.mjs"></script>
  <script src="./shell.js"></script>
</body>
</html>
