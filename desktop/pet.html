<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Owner Companion</title>
  <link rel="stylesheet" href="./pet.css" />
</head>
<body>
  <div class="stage">
    <button id="pet" class="pet" data-phase="idle" type="button" aria-label="Owner Companion">
      <span class="plate" aria-hidden="true"></span>
      <img id="mascot" class="mascot" alt="" draggable="false" />
      <span class="ring" aria-hidden="true"></span>
      <span class="badge" id="badge" hidden>0</span>
      <span class="phase-dot" id="phaseDot" aria-hidden="true"></span>
    </button>
    <div class="hint" id="hint">Owner</div>
  </div>
  <script src="./pet.js"></script>
</body>
</html>
