<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>卡片原型 · 单入口对话</title>
<!--
  原型，不是产品代码。目的是回答一个问题：
  「卡片只剩一个对话窗口时，顶栏的会话/项目、斜杠命令、生成式回复该怎么排才对。」

  三个变体在结构上互相不同意：
    A  双弹窗顶栏 + 固定输入框（最常规：两个药丸各开小弹窗）
    B  面包屑顶栏 + 底部抽屉 + 输入框在流末尾（把导航压成一行字）
    C  幽灵顶栏 + 全屏命令面板（平时只剩一个点和输入框）

  切换：?variant=A|B|C，或底部中间的原型切换条，或键盘左右方向键。
  所有状态在内存里，刷新即回到初始。没有持久化，没有真实后端。
-->
<style>
  :root {
    --bg: #0f1216;
    --card: #ffffff;
    --ink: #1a1d21;
    --ink-2: #5b6470;
    --ink-3: #8b95a1;
    --line: #e7eaee;
    --line-2: #f1f3f6;
    --brand: #2f6df6;
    --brand-soft: #eaf0ff;
    --warn: #b26a00;
    --warn-soft: #fff5e5;
    --ok: #1f7a4d;
    --ok-soft: #e8f6ee;
    --danger: #c0392b;
    --radius: 14px;
    --shadow: 0 18px 48px rgba(8, 12, 18, .28), 0 2px 8px rgba(8, 12, 18, .12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font: 13px/1.55 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 600px at 20% 0%, #26313d 0%, #161b21 45%, #0f1216 100%);
    display: grid;
    place-items: center;
    padding: 36px 20px 120px;
  }

  /* ── 卡片外壳：三种变体共用尺寸，结构由 variant-* 决定 ───────────── */
  .card {
    position: relative;
    width: 420px;
    height: 600px;
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    isolation: isolate;
  }

  .card-head { flex: none; position: relative; z-index: 5; }

  /* ── A：两个药丸，各开小弹窗 ─────────────────────────────────── */
  .v-a .head-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line-2);
  }
  .v-a .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: #c9d0d8; flex: none; }
  .v-a .brand-dot.on { background: var(--ok); }
  .v-a .spacer { flex: 1; }
  .v-a .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 26px; padding: 0 9px;
    border: 1px solid var(--line); border-radius: 999px;
    background: #fff; color: var(--ink);
    font: inherit; cursor: pointer; max-width: 140px;
  }
  .v-a .pill:hover { border-color: #cfd6de; background: #fbfcfe; }
  .v-a .pill .caret { color: var(--ink-3); font-size: 10px; }
  .v-a .pill .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v-a .head-row > .tag { flex: none; white-space: nowrap; font-size: 10px; padding: 2px 6px; }
  .v-a .head-row .mini { border-color: #d6dce4; color: var(--ink-2); background: #fbfcfe; }

  /* ── B：面包屑，点任一段从底部出抽屉 ─────────────────────────── */
  .v-b .head-row {
    display: flex; align-items: center; gap: 6px;
    padding: 14px 16px 10px;
  }
  .v-b .crumb {
    border: 0; background: none; padding: 2px 4px; border-radius: 6px;
    font: inherit; color: var(--ink-2); cursor: pointer;
    max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .v-b .crumb:hover { background: var(--line-2); color: var(--ink); }
  .v-b .crumb.primary { color: var(--ink); font-weight: 600; }
  .v-b .sep { color: #c9d0d8; }

  /* ── C：幽灵顶栏，平时几乎不可见 ─────────────────────────────── */
  .v-c .head-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    opacity: .28; transition: opacity .18s;
  }
  .v-c .card:hover .head-row,
  .v-c .head-row:focus-within { opacity: 1; }
  .v-c .ghost {
    border: 0; background: none; padding: 2px 4px; border-radius: 6px;
    font: inherit; color: var(--ink-2); cursor: pointer;
  }
  .v-c .ghost:hover { background: var(--line-2); }
  .v-c .ghost .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; }

  /* ── 对话流 ───────────────────────────────────────────────────── */
  .thread {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 14px 8px;
    display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: thin;
  }
  .thread::-webkit-scrollbar { width: 8px; }
  .thread::-webkit-scrollbar-thumb { background: #dfe4ea; border-radius: 8px; }

  .auto-tag {
    flex: none; font-size: 10px; padding: 1px 5px; border-radius: 4px;
    background: #f1f3f6; color: var(--ink-3);
  }
  .custom-row { display: flex; gap: 6px; padding: 8px 12px 0; }
  .custom-row input {
    flex: 1; min-width: 0; height: 28px; border: 1px solid var(--line);
    border-radius: 7px; padding: 0 8px; font: inherit; font-size: 11.5px; outline: none;
  }
  .custom-row input:focus { border-color: #b9cdf8; }

  /* HITL：问一句，给选项，允许跳过 */
  /* 写权限：写什么 + 风险分级 */
  .write-block .risk {
    margin-left: auto; font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
    background: #f1f3f6; color: var(--ink-2);
  }
  .write-block .risk.low { background: var(--ok-soft); color: var(--ok); }
  .write-block .risk.mid { background: var(--warn-soft); color: var(--warn); }
  .write-block .risk.high { background: #fdeeed; color: var(--danger); }
  .risk-hint { color: var(--ink-3); }
  .risk-grid { display: grid; gap: 4px; padding: 2px 11px 8px; }
  .risk-grid > div { display: grid; grid-template-columns: 84px 1fr; gap: 8px; font-size: 11.5px; }
  .risk-grid span { color: var(--ink-3); }
  .risk-grid b { font-weight: 500; color: var(--ink-2); }
  .risk-basis { padding: 0 11px 8px; }
  .risk-basis summary {
    cursor: pointer; font-size: 11px; color: var(--ink-3); list-style: none;
    padding: 3px 0;
  }
  .risk-basis summary::-webkit-details-marker { display: none; }
  .risk-basis summary::before { content: '▸ '; }
  .risk-basis[open] summary::before { content: '▾ '; }
  .risk-basis ul { margin: 4px 0 0; padding-left: 16px; }
  .risk-basis li { color: var(--ink-2); font-size: 11px; line-height: 1.6; }
  .write-list { list-style: none; margin: 0; padding: 2px 11px 8px; }
  .write-list li { display: flex; align-items: flex-start; gap: 6px; padding: 3px 0; font: 11.5px/1.5 ui-monospace, Consolas, monospace; color: var(--ink-2); word-break: break-all; }

  .ask-block .warn-badge { background: var(--warn-soft); color: var(--warn); }
  .ask-tried { list-style: none; margin: 0; padding: 2px 11px 8px; }
  .ask-tried li { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 11px; padding: 2px 0; }
  .ask-opts { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 11px 10px; }
  .ask-opts .btn.ghost { border-style: dashed; color: var(--ink-2); }
  .ask-note { padding: 0 11px 10px; color: var(--ink-3); font-size: 11px; }

  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 100%; position: relative; }
  .msg.user { align-items: flex-end; }
  .bubble {
    padding: 8px 11px; border-radius: 12px; max-width: 86%;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: #f6f8fa; border-bottom-left-radius: 4px; }
  .msg.agent .bubble + .bubble { margin-top: 2px; }
  .who { font-size: 11px; color: var(--ink-3); }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand);
    font-size: 11.5px; font-weight: 600;
  }

  /* ── 生成式 UI 块 ─────────────────────────────────────────────── */
  .ui-block {
    border: 1px solid var(--line); border-radius: 12px;
    background: #fff; overflow: hidden;
  }
  .ui-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 11px; border-bottom: 1px solid var(--line-2);
  }
  .ui-head h4 { margin: 0; font-size: 12.5px; font-weight: 700; }
  .ui-head .badge {
    margin-left: auto; min-width: 18px; height: 18px; padding: 0 6px;
    border-radius: 9px; background: #f1f3f6; color: var(--ink-2);
    font-size: 11px; line-height: 18px; text-align: center;
  }
  .ui-sub { padding: 0 11px 8px; color: var(--ink-3); font-size: 11.5px; }

  .ui-sections { display: grid; gap: 0; }
  .ui-section { padding: 9px 11px; border-top: 1px solid var(--line-2); }
  .ui-section:first-child { border-top: 0; }
  .ui-section-head { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
  .ui-section-head b { font-size: 12px; }
  .ui-section-head span { color: var(--ink-3); font-size: 11px; }

  .row-item { display: flex; gap: 7px; padding: 4px 0; }
  .row-item .t { flex: 1; min-width: 0; }
  .row-item .t .title { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-item .t .meta { color: var(--ink-3); font-size: 11px; }

  .tag {
    display: inline-block; padding: 1px 6px; border-radius: 999px;
    font-size: 10.5px; line-height: 16px;
    background: var(--line-2); color: var(--ink-2);
  }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }

  .ui-foot {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 8px 11px; border-top: 1px solid var(--line-2); background: #fcfdfe;
  }
  .ui-foot .note { color: var(--ink-3); font-size: 11px; margin-right: auto; flex: 1 1 100%; }

  .btn {
    height: 26px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; flex: none;
  }
  .btn:hover { border-color: #ccd3db; background: #fbfcfe; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.danger { color: var(--danger); border-color: #f0d5d2; background: #fff8f7; }

  table.grid { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.grid th, table.grid td {
    text-align: left; padding: 6px 11px; border-top: 1px solid var(--line-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  table.grid th { color: var(--ink-3); font-weight: 500; border-top: 0; background: #fcfdfe; }
  table.grid td.num { font-variant-numeric: tabular-nums; }
  table.grid td .cell {
    display: inline-flex; align-items: center; gap: 5px;
  }

  /* ── 图标 ─────────────────────────────────────────────────────── */
  .ico { display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--ink-3); }
  .ico svg { width: 12px; height: 12px; display: block; }
  .ico.ok { color: var(--ok); }
  .ico.warn { color: var(--warn); }
  .ico.error { color: var(--danger); }
  .ico.brand { color: var(--brand); }
  .muted-text { color: var(--ink-3); font-size: 11px; }
  .grow { flex: 1; }

  /* ── 指标卡 ───────────────────────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); }
  .kpi { padding: 10px 11px; border-top: 1px solid var(--line-2); }
  .kpi:nth-child(-n+2) { border-top: 0; }
  .kpi:nth-child(odd) { border-right: 1px solid var(--line-2); }
  .kpi-label { color: var(--ink-3); font-size: 11px; }
  .kpi-value { font-size: 19px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .kpi-delta { display: flex; align-items: center; gap: 3px; color: var(--ink-3); font-size: 11px; }
  .kpi-delta.up { color: var(--ok); }
  .kpi-delta.down { color: var(--danger); }

  /* ── 图表 ─────────────────────────────────────────────────────── */
  .chart { padding: 8px 11px 10px; }
  .line-chart { width: 100%; height: 74px; display: block; }
  .line-chart .axis { stroke: var(--line); stroke-width: .6; }
  .line-chart .series { fill: none; stroke: var(--brand); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .line-chart .dot { fill: #fff; stroke: var(--brand); stroke-width: .9; vector-effect: non-scaling-stroke; }
  .chart-foot { display: flex; gap: 10px; color: var(--ink-3); font-size: 10.5px; margin-top: 4px; }

  .donut-wrap { display: flex; align-items: center; gap: 14px; padding: 10px 11px 12px; }
  .donut { width: 74px; height: 74px; flex: none; }
  .donut-total { font: 700 7px system-ui; fill: var(--ink); }
  .legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; flex: 1; }
  .legend li { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
  .legend i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
  .legend b { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ── 时间线 ───────────────────────────────────────────────────── */
  .timeline { list-style: none; margin: 0; padding: 6px 11px 10px; }
  .timeline .step { display: flex; gap: 9px; padding: 6px 0; position: relative; }
  .timeline .step + .step::before {
    content: ''; position: absolute; left: 6px; top: -6px; height: 12px;
    border-left: 1px dashed #dfe4ea;
  }
  .timeline .dot {
    width: 13px; height: 13px; border-radius: 50%; margin-top: 2px;
    display: grid; place-items: center; background: var(--ok-soft); color: var(--ok);
  }
  .timeline .dot svg { width: 8px; height: 8px; }
  .timeline .step.warn .dot { background: var(--warn-soft); color: var(--warn); }
  .timeline .step.error .dot { background: #fdeeed; color: var(--danger); }
  .timeline .step.pending .dot { background: #f1f3f6; color: var(--ink-3); }
  .step-body { flex: 1; min-width: 0; }
  .step-title { font-size: 12.5px; }
  .step-meta { color: var(--ink-3); font-size: 11px; }
  .step-at { color: var(--ink-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }

  /* ── 键值 / 代码 / 徽章墙 ─────────────────────────────────────── */
  .kv { margin: 0; padding: 4px 11px 10px; }
  .kv > div { display: grid; grid-template-columns: 78px 1fr; gap: 8px; padding: 3px 0; font-size: 12px; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; word-break: break-all; }

  pre.code {
    margin: 0; padding: 8px 0; background: #fbfcfd; overflow-x: auto;
    font: 11.5px/1.65 ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  pre.code .cl { display: flex; }
  pre.code .ln {
    flex: none; width: 26px; text-align: right; padding-right: 9px;
    color: #b6bfc9; user-select: none;
  }
  pre.code .lc { display: block; white-space: pre; color: var(--ink-2); }

  .badge-wall { display: flex; flex-wrap: wrap; gap: 6px; padding: 9px 11px 11px; }
  .badge-wall .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; font-size: 11px; }
  .badge-wall .tag svg { width: 10px; height: 10px; }

  .diff { font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .diff .d-row { display: flex; gap: 8px; padding: 2px 11px; }
  .diff .d-row .m { width: 10px; color: var(--ink-3); }
  .diff .add { background: #eefaf2; }
  .diff .add .m { color: var(--ok); }
  .diff .del { background: #fdf1f0; }
  .diff .del .m { color: var(--danger); }

  .bars { padding: 10px 11px; display: grid; gap: 7px; }
  .bar-row { display: grid; grid-template-columns: 84px 1fr 34px; align-items: center; gap: 8px; font-size: 11.5px; }
  .bar { height: 8px; border-radius: 4px; background: #eef1f5; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
  .bar-row .n { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  details.tool { border: 1px solid var(--line); border-radius: 10px; background: #fbfcfd; }
  details.tool summary {
    cursor: pointer; padding: 7px 10px; font-size: 11.5px; color: var(--ink-2);
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool summary .k { font: 11px ui-monospace, Consolas, monospace; color: var(--brand); }
  details.tool pre {
    margin: 0; padding: 8px 10px 10px; border-top: 1px solid var(--line-2);
    font: 11.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: var(--ink-2); white-space: pre-wrap; word-break: break-word;
  }

  .thinking { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12px; }
  .thinking i {
    width: 5px; height: 5px; border-radius: 50%; background: #c3cbd4;
    animation: blink 1.1s infinite;
  }
  .thinking i:nth-child(2) { animation-delay: .18s; }
  .thinking i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  /* ── 输入区 ───────────────────────────────────────────────────── */
  .composer-wrap { flex: none; position: relative; z-index: 4; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--line-2);
    background: #fff;
  }
  .composer textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font: inherit; color: var(--ink);
    background: #fff; min-height: 36px; max-height: 96px; outline: none;
  }
  .composer textarea:focus { border-color: #b9cdf8; box-shadow: 0 0 0 3px rgba(47,109,246,.10); }
  .send {
    height: 36px; padding: 0 14px; border-radius: 10px; border: 0;
    background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  .send[disabled] { opacity: .4; cursor: not-allowed; }

  /* B：对话流按内容高度，输入框跟着最后一条走（像文档），不钉在底部 */
  .v-b .thread { flex: 0 1 auto; padding-bottom: 0; }
  .v-b .composer { border-top: 0; padding: 8px 14px 12px; }

  /* ── 斜杠面板 ─────────────────────────────────────────────────── */
  .slash {
    position: absolute; left: 10px; right: 10px; bottom: 62px;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 30px rgba(10,15,22,.14); overflow: hidden; z-index: 8;
  }
  .slash-head { padding: 7px 10px; font-size: 11px; color: var(--ink-3); border-bottom: 1px solid var(--line-2); }
  /* 技能列表：滚动看全部 */
  .skill-scroll { max-height: 268px; overflow-y: auto; }
  .slash-group {
    position: sticky; top: 0; z-index: 1;
    padding: 5px 11px; background: #fbfcfe;
    border-top: 1px solid var(--line-2);
    color: var(--ink-3); font-size: 10.5px; letter-spacing: .02em;
  }
  .slash-group:first-child { border-top: 0; }
  .slash-item.skill .cmd { width: 132px; }
  .slash-item .num.empty { background: none; }
  .slash-foot {
    padding: 6px 11px; border-top: 1px solid var(--line-2);
    color: var(--ink-3); font-size: 10.5px; background: #fcfdfe;
  }

  .slash-item {
    display: flex; gap: 8px; align-items: center; padding: 7px 10px; cursor: pointer;
  }
  .slash-item .num {
    width: 16px; height: 16px; flex: none; border-radius: 4px;
    background: #f1f3f6; color: var(--ink-2);
    font: 10.5px/16px ui-monospace, Consolas, monospace; text-align: center;
  }
  .slash-item.on .num { background: #fff; color: var(--brand); }
  .slash-item .cmd { font: 11.5px ui-monospace, Consolas, monospace; color: var(--brand); width: 118px; flex: none; white-space: nowrap; }
  .slash-item .desc { color: var(--ink-2); font-size: 12px; flex: 1; min-width: 0; }
  .slash-item .src {
    flex: none; font-size: 10px; padding: 1px 5px; border-radius: 4px;
    background: #f1f3f6; color: var(--ink-3);
  }
  .slash-item .src.pstack { background: #eef4ff; color: #2f6df6; }
  .slash-item .src.matt { background: #f2f7ee; color: #4b7a34; }
  .slash-item .src.demo { background: #fff5e5; color: var(--warn); }
  .slash-item.on { background: var(--brand-soft); }
  .slash-head .link {
    float: right; border: 1px solid var(--line); background: #fff; color: var(--brand);
    height: 20px; padding: 0 7px; border-radius: 6px; font: inherit; font-size: 11px; cursor: pointer;
  }
  .slash-head .link:hover { border-color: #b9cdf8; background: #f7f9ff; }
  .num-input {
    width: 20px; height: 18px; flex: none; text-align: center;
    border: 1px solid #b9cdf8; border-radius: 4px; padding: 0;
    font: 11px ui-monospace, Consolas, monospace; color: var(--brand);
  }
  .num-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(47,109,246,.16); }
  .num-input.conflict { border-color: #e0a0a0; color: var(--danger); background: #fff8f7; }
  .slash-warn {
    padding: 6px 11px; border-top: 1px solid #f3dedb; background: #fff8f7;
    color: var(--danger); font-size: 11px;
  }

  /* 输入框上方的数字快捷条：只放最常用的三条，空输入时才出现 */
  .quick {
    display: flex; align-items: center; gap: 5px; flex-wrap: nowrap;
    padding: 7px 12px 0; background: #fff;
  }
  .quick .hint { color: var(--ink-3); font-size: 11px; margin-right: 2px; flex: none; white-space: nowrap; }
  .quick button {
    display: inline-flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 8px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    font: inherit; font-size: 11.5px; cursor: pointer;
    min-width: 0; overflow: hidden;
  }
  .quick button .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quick button:hover { border-color: #ccd3db; background: #fbfcfe; color: var(--ink); }
  .quick button .n {
    width: 15px; height: 15px; border-radius: 4px; background: #f1f3f6;
    font: 10px/15px ui-monospace, Consolas, monospace; text-align: center; color: var(--ink-2);
  }
  .quick button:hover .n { background: var(--brand-soft); color: var(--brand); }

  /* C：全屏命令面板（挂在卡片层，盖住对话流但留出输入框） */
  .v-c .slash.sheet {
    position: absolute; left: 0; right: 0; top: 0; bottom: 62px; z-index: 30;
    border-radius: 0; border: 0; border-bottom: 1px solid var(--line-2);
    box-shadow: none; display: flex; flex-direction: column;
  }
  .v-c .slash.sheet .sheet-body { overflow-y: auto; padding: 6px 0; }
  .v-c .slash.sheet .slash-item { padding: 11px 16px; }
  .v-c .slash.sheet .slash-head { padding: 13px 16px; font-size: 12px; background: #fcfdfe; }

  /* ── 弹窗 / 抽屉 ──────────────────────────────────────────────── */
  .popover {
    position: absolute; top: 46px; z-index: 20;
    width: 268px; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 14px 34px rgba(10,15,22,.16);
    overflow: hidden;
  }
  .popover.left { left: 12px; }
  .popover.right { right: 12px; }
  .pop-head { padding: 8px 10px; font-size: 11px; color: var(--ink-3); border-bottom: 1px solid var(--line-2); }
  .pop-list { max-height: 240px; overflow-y: auto; }
  .pop-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    cursor: pointer; border: 0; background: none; width: 100%; text-align: left; font: inherit;
  }
  .pop-item:hover { background: #f7f9fc; }
  .pop-item.on { background: var(--brand-soft); }
  .pop-item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pop-item .t .name { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop-item .t .meta { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop-item .tick { color: var(--brand); font-size: 12px; }
  .pop-add {
    display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line-2);
    background: #fcfdfe;
  }
  .pop-add.split { flex-direction: column; }
  .pop-add input {
    flex: 1; min-width: 0; height: 28px; border: 1px solid var(--line);
    border-radius: 7px; padding: 0 8px; font: inherit; font-size: 12px;
  }
  .pop-add input:focus { outline: none; border-color: #b9cdf8; }
  .pop-hint { padding: 0 10px 8px; color: var(--ink-3); font-size: 11px; }

  .pop-search { padding: 6px 8px; border-bottom: 1px solid var(--line-2); }
  .pop-search input {
    width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 7px;
    padding: 0 8px; font: inherit; font-size: 12px;
  }
  .pop-search input:focus { outline: none; border-color: #b9cdf8; }
  .pop-empty { padding: 14px 12px; color: var(--ink-3); font-size: 12px; text-align: center; }

  .pop-item .acts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
  .pop-item:hover .acts, .pop-item.on .acts { opacity: 1; }
  .pop-item .pin {
    display: inline-block; margin-right: 5px; padding: 0 5px;
    border-radius: 4px; background: #fff5e5; color: var(--warn);
    font-size: 10px; line-height: 15px; vertical-align: 1px;
  }
  .mini {
    height: 22px; min-width: 22px; padding: 0 6px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    font: inherit; font-size: 11px; cursor: pointer;
  }
  .mini:hover { background: #f7f9fc; border-color: #ccd3db; }
  .mini.danger { color: var(--danger); border-color: #f0d5d2; }
  .mini.danger:hover { background: #fff5f4; }
  .mini.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .pop-item.editing { gap: 6px; cursor: default; }
  .pop-item.editing input {
    flex: 1; min-width: 0; height: 26px; border: 1px solid #b9cdf8; border-radius: 6px;
    padding: 0 7px; font: inherit; font-size: 12px;
  }
  .pop-item.editing input:focus { outline: none; box-shadow: 0 0 0 3px rgba(47,109,246,.12); }
  .pop-item.confirming { background: #fff8f7; cursor: default; gap: 6px; }
  .pop-item.confirming .name { color: var(--danger); }

  /* B：底部抽屉 */
  .drawer {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #fff; border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; box-shadow: 0 -12px 30px rgba(10,15,22,.14);
    max-height: 78%; display: flex; flex-direction: column;
  }
  .drawer-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line-2);
  }
  .drawer-head b { font-size: 12.5px; }
  .drawer-head .x { margin-left: auto; border: 0; background: none; font-size: 16px; color: var(--ink-3); cursor: pointer; }
  .drawer .pop-list { max-height: none; }
  .drawer .pop-add { padding: 10px 14px; }
  .backdrop { position: absolute; inset: 0; background: rgba(12,16,22,.18); z-index: 15; }

  /* ── 工具条 / 状态面 ──────────────────────────────────────────── */
  .toast {
    position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%);
    background: #1d2228; color: #fff; padding: 7px 12px; border-radius: 8px;
    font-size: 12px; z-index: 40; opacity: 0; transition: opacity .18s; pointer-events: none;
    max-width: 88%; text-align: center;
  }
  .toast.on { opacity: 1; }

  .state-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    border: 0; background: none; color: var(--ink-3); font-size: 11px; cursor: pointer;
  }
  .state-panel {
    position: absolute; inset: 0; z-index: 45; background: rgba(15,18,22,.55);
    display: grid; place-items: center; padding: 16px;
  }
  /* @@ 方法菜单（贴着输入框）与弹窗（盖住卡片） */
  .at-menu {
    position: absolute; left: 10px; right: 10px; bottom: 62px; z-index: 12;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 30px rgba(10,15,22,.14); overflow: hidden;
  }
  .at-method {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 10px 12px; border: 0; background: none; text-align: left; font: inherit; cursor: pointer;
    border-top: 1px solid var(--line-2);
  }
  .at-method:first-of-type { border-top: 0; }
  .at-method:hover { background: #f7f9fc; }
  .at-method .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .at-method .name { font-size: 12.5px; font-weight: 600; }
  .at-method .meta { color: var(--ink-3); font-size: 11px; }
  .at-method .go { color: var(--ink-3); font-size: 15px; }

  .at-modal {
    position: absolute; inset: 0; z-index: 40; background: #fff;
    display: flex; flex-direction: column;
  }
  .at-body { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
  .at-row {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 9px 12px; border: 0; background: none; text-align: left; font: inherit; cursor: pointer;
  }
  .at-row:hover { background: #f7f9fc; }
  .at-row.on { background: var(--brand-soft); }
  .at-row[disabled] { opacity: .45; cursor: not-allowed; }
  .at-row .box {
    width: 16px; height: 16px; flex: none; border-radius: 4px; border: 1px solid #cfd6de;
    background: #fff; color: #fff; font-size: 11px; line-height: 14px; text-align: center;
  }
  .at-row.on .box { background: var(--brand); border-color: var(--brand); }
  .at-row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .at-row .name { font-size: 12.5px; }
  .at-row .meta { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .at-field { display: block; padding: 10px 12px 0; }
  .at-field > span { display: block; color: var(--ink-3); font-size: 11px; margin-bottom: 5px; }
  .at-field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px;
    font: inherit; font-size: 12.5px; resize: none; outline: none;
  }
  .at-field textarea:focus { border-color: #b9cdf8; box-shadow: 0 0 0 3px rgba(47,109,246,.10); }
  .at-foot {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 12px; border-top: 1px solid var(--line-2);
  }
  .at-foot .muted-text { flex: 1 1 100%; }
  .at-tabs { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; }
  .at-tab {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 3px 10px; font: inherit; font-size: 11.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap;
  }
  .at-tab.on { background: var(--brand-soft); border-color: #c6d8ff; color: var(--brand); }

  .ref-chip i { font-style: normal; color: var(--ink-3); font-size: 10.5px; }

  /* ── @@ 关联：胶囊 + 面板 ─────────────────────────────────────── */
  .ref-chips {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 12px 0; background: #fff;
  }
  .ref-chip {
    display: inline-flex; align-items: center; gap: 5px;
    height: 22px; padding: 0 4px 0 8px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand); font-size: 11.5px;
  }
  .ref-chip b { font-weight: 700; }
  .ref-chip .x {
    border: 0; background: none; color: var(--brand); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 4px; opacity: .65;
  }
  .ref-chip .x:hover { opacity: 1; }

  .at-panel {
    position: absolute; left: 10px; right: 10px; bottom: 62px;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 30px rgba(10,15,22,.14); overflow: hidden; z-index: 9;
  }  .at-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-bottom: 1px solid var(--line-2); font-size: 11.5px;
  }
  .at-list { max-height: 216px; overflow-y: auto; }
  .at-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 7px 10px; border: 0; background: none; text-align: left; font: inherit; cursor: pointer;
  }
  .at-item:hover { background: #f7f9fc; }
  .at-item.on { background: var(--brand-soft); }
  .at-item.picked .tick { color: var(--brand); }
  .at-item .kind {
    flex: none; width: 30px; text-align: center; font-size: 10px;
    border-radius: 4px; padding: 1px 0; background: #f1f3f6; color: var(--ink-2);
  }
  .at-item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .at-item .name { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .at-item .meta { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .at-item .tick { color: var(--ink-3); font-size: 12px; width: 12px; }

  /* ── 复制 / 转 prompt / prompt 面板 ───────────────────────────── */
  .msg.agent { position: relative; }
  .msg-foot { display: flex; justify-content: flex-end; height: 22px; margin-top: -2px; }
  .acts {
    display: inline-flex; gap: 3px; opacity: 0; transition: opacity .12s;
  }
  .msg.agent:hover .msg-foot .acts, .msg.agent:focus-within .msg-foot .acts { opacity: 1; }
  .acts .mini { height: 20px; min-width: 20px; padding: 0 5px; font-size: 11px; }

  .ui-block { position: relative; }
  /* 动作条常驻在标题右侧的留白里：只占位，不显形，避免悬停时挤动徽章。 */
  .ui-head { padding-right: 58px; }
  .block-acts {
    position: absolute; right: 6px; top: 7px; z-index: 3;
    background: rgba(255, 255, 255, .94); border-radius: 7px; padding: 1px;
  }
  .ui-block:hover .block-acts, .ui-block:focus-within .block-acts,
  details.tool:hover .block-acts { opacity: 1; }
  details.tool summary { padding-right: 52px; }

  .prompt-sheet {
    position: absolute; inset: 0; z-index: 50; background: #fff;
    display: flex; flex-direction: column;
  }
  .prompt-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--line-2);
  }
  .prompt-head b { font-size: 12.5px; }
  .prompt-head .x {
    margin-left: auto; border: 0; background: none; font-size: 17px;
    color: var(--ink-3); cursor: pointer; line-height: 1;
  }
  .prompt-sheet textarea {
    flex: 1; border: 0; resize: none; outline: none; padding: 12px 14px;
    font: 11.5px/1.7 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: var(--ink); background: #fcfdfe; white-space: pre-wrap;
  }
  .prompt-foot {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 14px; border-top: 1px solid var(--line-2);
  }
  .prompt-foot .muted-text { flex: 1 1 100%; }

  /* @@ 小卡片：不再占满卡片，贴着输入框浮起来 */
  .at-card {
    position: absolute; left: 10px; right: 10px; bottom: 62px; z-index: 12;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 30px rgba(10,15,22,.16); overflow: hidden;
    display: flex; flex-direction: column; max-height: 340px;
  }
  .at-card-body { overflow-y: auto; padding-bottom: 4px; }
  .pick-count { padding: 8px 12px 0; color: var(--ink-2); font-size: 11.5px; }

  .share-target { display: flex; align-items: center; gap: 6px; padding: 10px 12px 0; flex-wrap: wrap; }
  .share-target .target {
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 10px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .share-target .target.on { border-color: #c6d8ff; background: var(--brand-soft); color: var(--brand); }
  .share-target .target[disabled] { opacity: .45; cursor: not-allowed; }
  .share-note { margin: 8px 12px 6px; color: var(--ink-3); font-size: 11px; line-height: 1.5; }

  .proj-row { border-top: 1px solid var(--line-2); }
  .proj-row.picked { background: #fbfcff; }
  .proj-head {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 9px 12px; border: 0; background: none; text-align: left; font: inherit; cursor: pointer;
  }
  .proj-head:hover { background: #f7f9fc; }
  .proj-head .caret { color: var(--ink-3); font-size: 10px; }
  .proj-head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .proj-head .name { font-size: 12.5px; }
  .proj-head .meta { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-mats { padding: 0 0 6px 12px; }
  .mat-row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px 12px 6px 0; border: 0; background: none; text-align: left; font: inherit; cursor: pointer;
    border-radius: 7px;
  }
  .mat-row:hover { background: #f7f9fc; }
  .mat-row.on .name { color: var(--brand); }
  .mat-row[disabled] { opacity: .45; cursor: not-allowed; }
  .mat-row .box {
    width: 14px; height: 14px; flex: none; border-radius: 4px; border: 1px solid #cfd6de;
    background: #fff; color: #fff; font-size: 10px; line-height: 12px; text-align: center;
  }
  .mat-row.on .box { background: var(--brand); border-color: var(--brand); }
  .mat-row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .mat-row .name { font-size: 12px; }
  .mat-row .meta { color: var(--ink-3); font-size: 10.5px; }

  /* 勾选态：点整条消息即可选，提问和回复都算 */
  .msg.pickable { cursor: pointer; border-radius: 10px; padding: 4px 6px 4px 22px; margin: -4px -6px; }
  .msg.pickable:hover { background: #f7f9fc; }
  .msg.picked { background: var(--brand-soft); }
  .msg.user.pickable:hover { background: #f2f6ff; }
  .msg .pick-box {
    position: absolute; left: 2px; top: 4px;
    width: 16px; height: 16px; border-radius: 4px; border: 1px solid #cfd6de;
    background: #fff; color: #fff; font-size: 11px; line-height: 14px; text-align: center;
  }
  .msg.picked .pick-box { background: var(--brand); border-color: var(--brand); }

  /* ── 配置箱 ───────────────────────────────────────────────────── */
  .settings-sheet {
    position: absolute; inset: 0; z-index: 48; background: #fff;
    display: flex; flex-direction: column;
  }
  .settings-head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--line-2);
  }
  .settings-head b { font-size: 13px; }
  .settings-head .muted-text { font-size: 10.5px; line-height: 1.4; }
  .settings-head .x {
    margin-left: auto; border: 0; background: none; font-size: 17px;
    color: var(--ink-3); cursor: pointer; line-height: 1;
  }
  .settings-body { flex: 1; overflow-y: auto; padding: 6px 14px 12px; }
  .cfg-group { padding: 8px 0 10px; border-bottom: 1px dashed var(--line); }
  .cfg-group:last-child { border-bottom: 0; }
  .cfg-group h4 { margin: 4px 0 8px; font-size: 11.5px; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
  .cfg-row { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: center; padding: 3px 0; }
  .cfg-label { color: var(--ink-2); font-size: 11.5px; }
  .cfg-input {
    width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 7px;
    padding: 0 8px; font: 11.5px/1.4 ui-monospace, Consolas, monospace; color: var(--ink);
    outline: none; background: #fff;
  }
  .cfg-input:focus { border-color: #b9cdf8; box-shadow: 0 0 0 3px rgba(47,109,246,.10); }
  .cfg-note { display: flex; align-items: center; gap: 5px; color: var(--ink-3); font-size: 10.5px; padding: 6px 0 0; }
  .cfg-note code { font: 10.5px ui-monospace, Consolas, monospace; color: var(--ink-2); }
  .cfg-inline { display: flex; align-items: center; gap: 6px; }
  .watch-line { display: flex; align-items: center; gap: 8px; padding: 5px 12px 0; }
  .watch-label { flex: none; width: 56px; color: var(--ink-2); font-size: 11.5px; }
  .watch-hint { color: var(--ink-3); font-size: 10.5px; white-space: nowrap; }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }
  .chip {
    max-width: 132px; height: 24px; padding: 0 9px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    font: inherit; font-size: 11.5px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

/* 数字快捷：指向具体技能，显示用英文原名；alias 只用于搜索与对话流里的中文标签。 */
const SLASH = [

  { num: 7, cmd: '/setup-pstack', alias: 'setup', desc: 'Detect this machine and configure model, paths, skills, sharing.', key: 'setup', source: 'pstack', skill: 'setup-pstack', implicit: false, say: '帮我探测并配置本机。' },
  { num: 8, cmd: '/showcase', alias: '展示', desc: 'Render every generative UI block (prototype demo).', key: 'showcase', source: 'demo', skill: 'showcase', implicit: false, say: '把生成式 UI 能渲染的东西都给我看一遍。' }
];

const SOURCE_LABEL = { pstack: 'pstack', matt: 'matt', demo: '演示' };

/** 数字别名：默认来自 SLASH 的 num，用户可以改；改完按数字调用，不必打中文。 */
const numOf = (key) => {
  const custom = state.nums[key];
  if (custom !== undefined && custom !== '') return Number(custom);
  return SLASH.find((item) => item.key === key)?.num ?? 9;
};

/** 按当前别名排序：数字小的在前，和输入 / 之后看到的顺序一致。 */
const slashByNum = () => SLASH.slice().sort((a, b) => numOf(a.key) - numOf(b.key));

/** 数字冲突要看得见：两个命令抢同一个数字时，两行都标出来。 */
const numConflicts = () => {
  const seen = new Map();
  for (const item of SLASH) {
    const n = numOf(item.key);
    seen.set(n, [...(seen.get(n) ?? []), item.key]);
  }
  return new Set([...seen.values()].filter((keys) => keys.length > 1).flat());
};

/** 斜杠查询：数字、英文原名、中文别名都能定位。 */
function slashMatches(rawQuery) {
  const query = String(rawQuery ?? '').replace(/^\//u, '').trim();
  if (!query) return slashByNum();
  if (/^\d+$/u.test(query)) return slashByNum().filter((item) => String(numOf(item.key)).startsWith(query));
  const lower = query.toLowerCase();
  return slashByNum().filter((item) => (
    item.cmd.slice(1).toLowerCase().includes(lower) || String(item.alias ?? '').includes(query)
  ));
}

/** 全部技能：数字快捷之外的那些，按来源分组，英文原名与英文说明。 */
function skillMatches(rawQuery) {
  const query = String(rawQuery ?? '').replace(/^\//u, '').trim().toLowerCase();
  const quickIds = new Set(SLASH.map((item) => item.skill));
  return SKILLS
    .filter((skill) => !quickIds.has(skill.id))
    .filter((skill) => !query || skill.id.toLowerCase().includes(query) || skill.desc.toLowerCase().includes(query));
}

const currentSession = () => state.sessions.find((s) => s.id === state.sessionId) ?? state.sessions[0] ?? null;
/** 项目可为空：空就是全局模式，不绑定任何项目。 */
const currentProject = () => {
  if (!state.projectId) return null;
  return state.projects.find((p) => p.id === state.projectId) ?? state.projects[0] ?? null;
};
const projectLabel = () => currentProject()?.name ?? '全局';

/* ── 图标：内联 SVG，跟随文字颜色，不引外部资源 ───────────────── */
const ICON = {

/** 图标节点：类名带上语义色（ok / warn / error / muted）。 */
const icon = (name, tone = '') => `<span class="ico ${tone}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICON[name] ?? ''}</svg></span>`;

/* ── 复制 / 转 prompt / 导出 ─────────────────────────────────────
   复制走「所见即所得」：把 DOM 转成 Markdown，而不是另维护一份 md 生成器。
   ──────────────────────────────────────────────────────────────── */
const txt = (node) => String(node?.textContent ?? '').replace(/\s+/gu, ' ').trim();

/** 把一块生成式 UI 转成 Markdown。认不出的形态退化成纯文本，不丢内容。 */
function mdOfBlock(node) {
  if (!node) return '';
  // 块级：先取标题/说明/分节，再把内部的结构化子块递归下去。
  // 动作条（⧉⌘）是界面装饰，绝不进 Markdown，所以这里不整块取 textContent。
  if (node.matches?.('.ui-block')) {
    const parts = [];
    const title = txt(node.querySelector('.ui-head h4'));
    const badge = txt(node.querySelector('.ui-head .badge'));
    if (title) parts.push(`### ${title}${badge ? ` · ${badge}` : ''}`);
    const sub = txt(node.querySelector('.ui-sub'));
    if (sub) parts.push(sub);
    for (const section of node.querySelectorAll('.ui-section')) {
      const label = txt(section.querySelector('.ui-section-head b'));
      const count = txt(section.querySelector('.ui-section-head span'));
      parts.push(`**${label}${count ? ` · ${count}` : ''}**`);
      const items = [...section.querySelectorAll('.row-item')].map((row) => `- ${txt(row.querySelector('.title') ?? row)}`);
      if (items.length) parts.push(items.join('\n'));
    }
    const inner = node.querySelectorAll(':scope > .kpis, :scope > .badge-wall, :scope > table.grid, :scope > .chart, :scope > .donut-wrap, :scope > ol.timeline, :scope > dl.kv, :scope > pre.code, :scope > .diff, :scope > .bars');
    for (const child of inner) {
      const md = mdOfBlock(child);
      if (md) parts.push(md);
    }
    const note = txt(node.querySelector('.ui-foot .note'));
    if (note) parts.push(`_${note}_`);
    return parts.filter(Boolean).join('\n\n');
  }
  if (node.matches?.('details.tool')) {
    return `**${txt(node.querySelector('summary'))}**\n\n\`\`\`text\n${String(node.querySelector('pre')?.textContent ?? '').trim()}\n\`\`\``;
  }
  if (node.matches?.('table.grid')) {
    const head = [...node.querySelectorAll('thead th')].map((th) => txt(th));
    const rows = [...node.querySelectorAll('tbody tr')].map((tr) => [...tr.querySelectorAll('td')].map((td) => txt(td)));
    return [
      `| ${head.join(' | ')} |`,
      `| ${head.map(() => '---').join(' | ')} |`,
      ...rows.map((cells) => `| ${cells.join(' | ')} |`)
    ].join('\n');
  }
  if (node.matches?.('.kpis')) {
    return [...node.querySelectorAll('.kpi')].map((kpi) => (
      `- **${txt(kpi.querySelector('.kpi-label'))}**：${txt(kpi.querySelector('.kpi-value'))}（${txt(kpi.querySelector('.kpi-delta'))}）`
    )).join('\n');
  }
  if (node.matches?.('.chart')) {
    const svg = node.querySelector('svg');
    return `（折线图：${String(svg?.dataset.points ?? '').split(',').join(' → ')}${svg?.dataset.unit ?? ''}）`;
  }
  if (node.matches?.('.donut-wrap')) {
    return [...node.querySelectorAll('.legend li')].map((li) => (
      `- ${txt(li.querySelector('span'))}：${txt(li.querySelector('b'))}`
    )).join('\n');
  }
  if (node.matches?.('.timeline')) {
    return [...node.querySelectorAll('.step')].map((step, index) => {
      const title = txt(step.querySelector('.step-title'));
      const meta = txt(step.querySelector('.step-meta'));
      const at = txt(step.querySelector('.step-at'));
      return `${index + 1}. ${title}${meta ? ` — ${meta}` : ''}${at ? `（${at}）` : ''}`;
    }).join('\n');
  }
  if (node.matches?.('.kv')) {
    return [...node.querySelectorAll('dt')].map((dt) => (
      `- **${txt(dt)}**：${txt(dt.parentElement.querySelector('dd'))}`
    )).join('\n');
  }
  if (node.matches?.('pre.code')) {
    const lang = txt(node.closest('.ui-block')?.querySelector('.ui-head .badge'));
    const body = [...node.querySelectorAll('.cl')].map((row) => row.querySelector('.lc')?.textContent ?? '').join('\n');
    return `\`\`\`${lang}\n${body}\n\`\`\``;
  }
  if (node.matches?.('.diff')) {
    const body = [...node.querySelectorAll('.d-row')].map((row) => {
      const mark = row.classList.contains('add') ? '+' : row.classList.contains('del') ? '-' : ' ';
      return `${mark} ${txt(row.querySelector('span:last-child'))}`;
    }).join('\n');
    return `\`\`\`diff\n${body}\n\`\`\``;
  }
  if (node.matches?.('.badge-wall')) {
    return [...node.querySelectorAll('.tag')].map((tag) => `- ${txt(tag)}`).join('\n');
  }
  if (node.matches?.('.bars')) {
    return [...node.querySelectorAll('.bar-row')].map((row) => {
      const cells = [...row.children].map((c) => txt(c));
      return `- ${cells[0]}：${cells[cells.length - 1]}`;
    }).join('\n');
  }
  return txt(node);
}

/** 一条消息转 Markdown：文字在前，块按出现顺序排。 */
function markdownOfMessage(index) {
  const message = state.messages[index];
  if (!message) return '';
  const parts = [];
  if (message.text) parts.push(message.text);
  const holder = document.querySelector(`[data-msg-index="${index}"]`);
  if (holder) {
    for (const block of holder.querySelectorAll('.ui-block, details.tool')) {
      const md = mdOfBlock(block);
      if (md) parts.push(md);
    }
  }
  return parts.join('\n\n');
}

/** 转 prompt：上下文头 + 原样引用 + 你自己写的尾巴。relay 的规矩：不改写。 */
function promptOf(quote) {

    '',
    '# 原文（未改写）',
    String(quote ?? '').trim(),
    '',
    '# 我需要你',
    ''
  ].join('\n');

"matt","desc":"\"Configure this repo for the engineering skills: set up its issue tracker, triage label vocabulary, and domain doc layout. Run once before first use of the other engineering skills.\""},{"id":"setup-pre-commit","source":"matt","desc":"Set up Husky pre-commit hooks with lint-staged (Prettier), type checking, and tests in the current repo. Use when user wants to add pre-commit hooks, set up Husky, configure lint-staged, or add commit-time formatting/typechecking/testing."},{"id":"tdd","source":"matt","desc":"Test-driven development. Use when the user wants to build features or fix bugs test-first, mentions \"red-green-refactor\", or wants integration tests."},{"id":"teach","source":"matt","desc":"Teach the user a new skill or concept, within this workspace."},{"id":"to-questionnaire","source":"matt","desc":"Turn a decision you can't fully answer into a questionnaire for someone else to fill in."},{"id":"to-spec","source":"matt","desc":"\"Turn the current conversation into a spec and publish it to the project issue tracker: no interview, just synthesis of what you've already discussed.\""},{"id":"to-tickets","source":"matt","desc":"Break a plan, spec, or the current conversation into a set of tracer-bullet tickets, each declaring its blocking edges, published to the configured tracker (edges as text in one file per ticket locally, or native blocking links on a real tracker)."},{"id":"triage","source":"matt","desc":"Move issues and external PRs through a state machine of triage roles, categorise, verify, grill if needed, and write agent-ready briefs."},{"id":"wait-what","source":"matt","desc":"\"Stop. That last message did not land: re-pitch it.\""},{"id":"wayfinder","source":"matt","desc":"Plan a huge chunk of work (more than one agent session can hold) as a shared map of decision tickets on your issue tracker, and resolve them one at a time until the way to the destination is clear."},{"id":"wizard","source":"matt","desc":"Generate an interactive bash d":"bro","source":"pstack","desc":"Restate the last message in plain human language, with no jargon."},{"id":"correct","source":"pstack","desc":"\"Find the mistakes agents keep repeating in this repo and make each one impossible. Try architecture first, then types, then a lint whose error names the fix, then a test, and write docs last. Prove each check fails on a real past mistake. Repeat this each time the operator corrects you. Use for /correct.\""},{"id":"create-verification-skill","source":"pstack","desc":"\"Generate a project-local verification skill that drives your app the way a user does, any language, framework, or platform. Use for /create-verification-skill, \\\"make a control skill for this repo\\\", or when a project has no scripted way to prove UI/CLI/service behavior.\""},{"id":"figure-it-out","source":"pstack","desc":"\"Design an auditable playbook when no narrower one fits: a large migration, an ambitious multi-part change, or work a human reviews after stepping away. Scales rigor to the task, runs a hypothesis loop, and logs decisions. Use for /figure-it-out or 'figure it out'.\""},{"id":"how","source":"pstack","desc":"\"Use for \\\"how does X work\\\", code walkthroughs before changing something, and placement / ownership / layering questions (\\\"where should this live\\\", \\\"which package owns this\\\", \\\"is this the right layer\\\"). Explains subsystem architecture, runtime flow, onboarding mental models. Use why for motivation.\""},{"id":"interrogate","source":"pstack","desc":"\"Use for \\\"interrogate\\\", \\\"adversarial review\\\", \\\"multi-model review\\\", \\\"challenge this\\\", \\\"stress test this code\\\", \\\"find blind spots\\\", or \\\"tear this apart\\\". Multiple LLM reviewers challenge changes from independent angles.\""},{"id":"ketchup","source":"pstack","desc":"\"Catch the user up on everything in this chat since their last message, in plain words. Give each action item an executive summary with enough context to make the call. Use for /ketchup.\""},{"id":"maintain-verification-skill","source":"pstack","desc":"\"Periodic pass that keeps a project's verification skill and feature map honest: parallel source readers per feature, one live session driving every feature, at most one PR of proven corrections. Use for /maintain-verification-skill or \\\"audit the verify skill\\\".\""},{"id":"Make Bot UI","source":"pstack","desc":">-"},{"id":"no-comments","source":"pstack","desc":"\"Spawn Comment Sicko, fix accepted findings, and offer encodings for claimed constraints.\""},{"id":"poteto-help","source":"pstack","desc":"Guides users through pstack setup, /poteto-mode, and picking the skill, playbook, or principle for a task. Type /poteto-help with a question."},{"id":"poteto-mode","source":"pstack","desc":"poteto's agent style for concise, detailed responses, deliberate subagents, unslopped prose, simple code, and verified work. Use for poteto, /poteto-mode, or requests to work in this style."},{"id":"principle-attack-the-premise","source":"pstack","desc":"\"Apply when two or more fixes that share one premise have failed the same gate. Take a census of which actors hold the imbalance before the next fix, then question the premise instead of writing another fix that assumes it.\""},{"id":"principle-boundary-discipline","source":"pstack","desc":"\"Apply when wiring validation, error handling, or framework adapters. Concentrate guards at system boundaries (CLI, config, network, external APIs); trust internal types and keep business logic in pure functions.\""},{"id":"principle-build-the-lever","source":"pstack","desc":"\"Apply to any non-trivial work, not just bulk work: edits, migrations, analyses, checks. Build the tool that does it or proves it (codemod, script, generator, or a skill your subagents follow) instead of working by hand. The tool is the artifact a reviewer can rerun.\""},{"id":"principle-encode-lessons-in-structure","source":"pstack","desc":"\"Apply when you catch yourself writing the same instruction a second time, or notice a recurring correction. Encode the rule as a lint, metadata flag, runtime check, or script instead of more text.\""},{"id":"principle-exhaust-the-design-space","source":"pstack","desc":"\"Apply when facing a novel UI interaction or architectural decision with no precedent in the codebase. Build 2-3 competing prototypes and compare side by side before committing.\""},{"id":"principle-experience-first","source":"pstack","desc":"\"Apply when product, UX, or feature-scope tradeoffs come up. Choose user delight over implementation convenience; ship fewer polished features over more rough ones.\""},{"id":"principle-explain-the-number","source":"pstack","desc":"\"Apply before you trust, report, or act on a number you measured: a speedup, a regression, a throughput, a latency, or an eval result. Find what limits it, and rule out that it measured something other than the work you think.\""},{"id":"principle-fix-root-causes","source":"pstack","desc":"\"Apply when debugging. Trace each symptom to its root cause and fix it there; reproduce first, ask why until you reach it, resist nil-check guards that silence crashes.\""},{"id":"principle-foundational-thinking","source":"pstack","desc":"\"Apply before writing logic: choosing core types and data structures, sequencing scaffold-vs-feature work, asking what concurrent actors share. Get the data structures right so downstream code becomes obvious.\""},{"id":"principle-guard-the-context-window","source":"pstack","desc":"\"Apply when context is filling up: large outputs, long files, repeated reads, fan-out planning. Route bulk to subagents; keep summaries in the main thread, not raw payloads.\""},{"id":"principle-laziness-protocol","source":"pstack","desc":"\"Apply when refactoring, evaluating diff size, or tempted to add abstractions, layers, or signal threading. Bias toward deletion and the smallest change that solves the problem.\""},{"id":"principle-make-operations-idempotent","source":"pstack","desc":"\"Apply when designing commands, lifecycle steps, or processing loops that run amid crashes, restarts, and retries. Converge to the same end state regardless of partial prior runs.\""},{"id":"principle-migrate-callers-then-delete-legacy-apis","source":"pstack","desc":"\"Apply when introducing a new internal API while old callers still exist. Migrate callers and delete the old API in the same wave instead of preserving compatibility layers.\""},{"id":"principle-minimize-reader-load","source":"pstack","desc":"\"Apply when reviewing or shaping code that's hard to trace. Count layers between question and answer, and hidden state in the reader's head; collapse one-caller wrappers and shrink mutable scope.\""},{"id":"principle-model-the-domain","source":"pstack","desc":"\"Apply when writing stateful logic, or when code branches a lot or repeats a shape assumption across files.\""},{"id":"principle-never-block-on-the-human","source":"pstack","desc":"\"Apply when tempted to ask 'should I do X?' on reversible work.\""},{"id":"principle-outcome-oriented-execution","source":"pstack","desc":"\"Apply during planned rewrites and migrations with explicit phase boundaries. Converge on the target architecture; don't preserve smooth intermediate states with throwaway compatibility code.\""},{"id":"principle-prove-it-works","source":"pstack","desc":"\"Apply after completing a task, before declaring done. Verify against the real artifact (run the feature, read the actual value, inspect the diff), not a proxy, self-report, or 'it compiles.'\""},{"id":"principle-redesign-from-first-principles","source":"pstack","desc":"\"Apply when integrating a new requirement into an existing design.\""},{"id":"principle-separate-before-serializing-shared-state","source":"pstack","desc":"\"Apply when concurrent actors might write to the same file, branch, key, or state object. Eliminate the sharing first; serialize structurally only when one shared writer is a real invariant.\""},{"id":"principle-sequence-verifiable-units","source":"pstack","desc":"\"Apply to multi-step work (sweeps, migrations, runs of similar edits) and to how you stack commits and PRs. Break work into small units that each end in a verifiable state, check each before the next, and order delivery so the sequence proves itself to a reviewer.\""},{"id":"principle-subtract-before-you-add","source":"pstack","desc":"\"Apply when sequencing an addition, refactor, or rewrite. Remove dead code, redundant validators, and stub references first, then build on the simpler base.\""},{"id":"principle-test-behavior-not-implementation","source":"pstack","desc":"\"Apply when you write, change, or keep a test. Call the code as its users do and assert the exact result they see. Rewrite or delete a test that would pass if every imported function returned undefined.\""},{"id":"principle-type-system-discipline","source":"pstack","desc":"\"Apply when designing types, reviewing a function signature, or writing code in any statically-typed language. Make illegal states unrepresentable, brand semantic primitives, parse external data at boundaries, refuse to lie to the compiler, exhaust variants, derive from authoritative schemas.\""},{"id":"recall","source":"pstack","desc":"\"Reconstruct your recent working context from your own chat history, live state, and the shared record (user reports, prior fixes, incidents), then hand back a tight current-state brief. Use for 'recall my work on X', 'catch me up', 'what have I been working on', 'where did I leave off', before starting or resuming work.\""},{"id":"reflect","source":"pstack","desc":"Spawn three parallel review subagents over the active transcript, surface learnings, and route each to a concrete edit on an existing skill. Use when the user says reflect."},{"id":"setup-pstack","source":"pstack","desc":"Configure which models pstack uses per role and at what reasoning budget. Detects your available models and writes the role map that overrides the skill defaults. Use for /setup-pstack, \"configure pstack models\", \"pstack budget\", or changing pstack's model choices."},{"id":"show-me-your-work","source":"pstack","desc":"\"Keep a reviewable decision trail for long-running or unattended work: a TSV log with one row per decision (what, why, evidence, result). Local by default; commit it when a reviewer needs the trail to trust the result. Use for /show-me-your-work, autonomous or multi-phase runs, or work a human reviews after stepping away.\""},{"id":"swarm","source":"pstack","desc":"\"Fan out N parallel workers, drain them, and return one report. Use for /swarm, 'swarm this', or parallel coverage, races, gauntlets, and exploration.\""},{"id":"tdd","source":"pstack","desc":"\"Use only when the user explicitly asks for TDD, a failing test, or a regression test, OR when the bug has an obvious cheap local test target. Skip when the test path is unclear, expensive, integration-heavy, or not requested.\""},{"id":"teach","source":"pstack","desc":"\"Explain a body of work plainly so a person actually understands it. Runs the `how` and `why` skills and weaves what they find into one clear explanation. Use for 'teach me this', 'help me really understand X', 'explain this change or subsystem to me'.\""},{"id":"technical-writing","source":"pstack","desc":"\"Layered technical-writing standard: Diátaxis structure, Google developer style sentences, STE instruction rules, Global English syntax. Use for /technical-writing or when writing or reviewing docs, RFCs, readmes, PR descriptions, or commit messages.\""},{"id":"typescript-best-practices","source":"pstack","desc":"TypeScript best practices. Use when reading or editing any .ts or .tsx file."},{"id":"unslop","source":"pstack","desc":"Cut AI tells from any writing."},{"id":"verify-app","source":"pstack","desc":"\"Use to prove a change works by driving the real artifact instead of reading code or trusting a self-report. Covers the boot recipe, input delivery, diagnostics, evidence artifact, and pass predicate for a CLI, an HTTP surface, a browser UI, or a scripted assertion. Use when a playbook says to verify on the matching surface.\""},{"id":"why","source":"pstack","desc":"\"Use for 'why does X work this way', 'why we picked Y', design rationale, regressions, postmortems, or data-backed thresholds. Discovers available MCPs and queries each evidence category (source control, issue tracker, long-form docs, real-time chat, infrastructure observability, error tracking, product analytics warehouse) in parallel, then returns a cited read on decisions and tradeoffs. Use how for runtime behavior.\""}];

const refKey = (ref) => `${ref.kind}:${ref.id}`;

/** 光标回到输入框末尾：从弹窗出来后要能接着写指令。 */
const focusEnd = () => {
  const input = document.getElementById('input');
  if (!input) return;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
};

/** 可勾选的对话项：助手回复按「第几条回复」，我的话按「我的第几句」。 */
function atPickables() {
  let replies = 0;
  let says = 0;
  return state.messages
    .map((message, index) => ({ message, index }))
    .map(({ message, index }) => {
      if (message.role === 'agent') {
        replies += 1;
        return { index, role: 'agent', label: `第 ${replies} 条回复`, message };
      }
      says += 1;
      return { index, role: 'user', label: `我的第 ${says} 句`, message };
    });
}

/** 自定义会话：拿一段路径/ID/关键词当线索，来源不确定就标 loose，让 Agent 去问。 */
function addCustomSession() {
  const input = document.getElementById('sessionQuery');
  const value = String(input?.value ?? '').trim();
  if (!value) { toast('先填个路径、ID 或关键词'); return; }
  const at = state.at;
  const id = `custom:${Date.now()}`;
  at.custom = { ...(at.custom ?? {}), [id]: value };
  if (!at.picked.includes(id)) at.picked.push(id);
  at.query = '';
  render();
  const next = document.getElementById('sessionQuery');
  if (next) next.focus();
}

function openAtMenu() {
  state.at = { step: 'menu' };
  state.draft = String(state.draft ?? '').replace(/@@[^\s@]*$/u, '');
  render();
}

function openAtMethod(key) {
  if (key === 'prompt') state.at = { step: 'prompt', picks: [], instruction: '' };
  else if (key === 'share') state.at = { step: 'share', picks: [], target: 'feishu' };
  else if (key === 'import' || key === 'session') state.at = { step: 'session', source: 'codex', picked: [], query: '' };
  else if (key === 'watch') {
    state.at = {
      step: 'watch',
      type: 'project',
      projectId: state.projectId,
      source: 'codex',
      sessionId: '',
      repo: 'GeTitDD/owner-agent-mvp',
      focus: ['commits', 'pull requests'],
      interval: state.watch.interval,
      cron: state.watch.cron
    };
  }
  else if (key === 'sync') {
    state.at = {
      step: 'sync',
      repo: 'GeTitDD/owner-pi-vault',
      direction: 'both',
      scope: 'changes',
      behind: 2,
      ahead: 1,
      add: 2,
      update: 1,
      archive: 1,
      conflict: true
    };
  }
  else state.at = { step: 'project', openId: '', auto: {}, mats: {} };
  render();
}

/** 已关联的引用做成可删的胶囊，显示在输入框上方。 */
function renderRefChips() {
  if (!state.refs.length) return '';
  return `
  <div class="ref-chips">
    ${state.refs.map((ref) => `
      <span class="ref-chip">
        <b>@</b>${esc(ref.label)}${ref.summary ? `<i>${esc(ref.summary)}</i>` : ''}
        <button class="x" data-ref-remove="${esc(refKey(ref))}" title="取消关联">×</button>
      </span>`).join('')}
    <span class="muted-text">${state.refs.length} 项已关联</span>
  </div>`;
}

/** 用关联项 + 指令拼一版 prompt：不替用户改写，只做结构化。 */
function composePrompt(instruction, refs = state.refs) {
  const project = currentProject();
  const parts = ['# 指令', instruction.trim() || '（还没写指令）', ''];
  parts.push('# 上下文');
  parts.push(project ? `当前项目：${project.name}` : '当前：全局模式（不绑定项目）');
  if (refs.length) {
    const projs = refs.filter((r) => r.kind === 'project');
    const sessions = refs.filter((r) => r.kind === 'session');
    const cards = refs.filter((r) => r.kind === 'message');
    if (projs.length) {
      parts.push('', '## 关联项目');
      for (const ref of projs) {
        const p = state.projects.find((item) => item.id === ref.id);
        if (!p) continue;
        parts.push(`- ${p.name}（${p.kind === 'github' ? 'GitHub' : '本地'} ${p.detail}）`);
        parts.push(`  - 关联资料：${ref.summary ?? '由 Agent 自行决定'}`);
      }
    }
    if (sessions.length) {
      parts.push('', '## 关联会话（指针，不是正文）');
      for (const ref of sessions) {
        parts.push(`- ${ref.label}${ref.summary ? ` · ${ref.summary}` : ''}`);
      }
      parts.push('需要什么就回到这些会话里检索；定位不到就问我，不要猜。');
    }
    if (cards.length) {
      parts.push('', '## 引用对话（原文）');
      for (const ref of cards) {
        const message = state.messages[Number(ref.id)];
        parts.push(`- ${ref.label}：${String(message?.text ?? '').replace(/\s+/gu, ' ').trim()}`);
      }
    }
  }
  parts.push('', '# 我需要你', '（这里由你补一句要对方做什么；引用保持原样，不要改写）');
  return parts.join('\n');
}

const copyText = async (text, label = '') => {
  const announce = () => {
    const kb = Math.max(1, Math.round(text.length / 102.4) / 10);
    toast(`${label ? label + ' ' : ''}已复制 ${kb}KB Markdown`);
  };
  try {
    await navigator.clipboard.writeText(text);
    announce();
    return true;
  } catch { /* 预览窗口常不给剪贴板写权限，走回退 */ }
  try {
    // 回退：临时 textarea + execCommand。真实应用里用 Electron 的 clipboard，这层用不到。
    const area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.top = '-1000px';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    const ok = document.execCommand('copy');
    area.remove();
    if (ok) { announce(); return true; }
  } catch { /* 继续走失败提示 */ }
  toast('这个窗口不给剪贴板权限：可点「转 prompt」面板里手动全选复制');
  return false;
};

function blockTable({ title, head, rows }) {

  return `

function blockBars({ title, items }) {

/** 折线：纯 SVG polyline，试点少时比引图表库划算。 */
function blockLine({ title, points, unit = '', labels = [] }) {
  const max = Math.max(...points, 1);
  const min = Math.min(...points, 0);
  const span = Math.max(max - min, 1);
  const stepX = 100 / Math.max(points.length - 1, 1);
  const coords = points.map((value, index) => {
    const x = index * stepX;
    const y = 30 - ((value - min) / span) * 26 - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  return `
  <div class="ui-block">
    <div class="ui-head"><h4>${esc(title)}</h4><span class="badge">${points.length} 点</span></div>
    <div class="chart">
      <svg viewBox="0 0 100 34" preserveAspectRatio="none" class="line-chart" data-points="${points.map((p) => esc(p)).join(',')}" data-unit="${esc(unit)}">
        <line x1="0" y1="30" x2="100" y2="30" class="axis" />
        <polyline points="${coords.join(' ')}" class="series" />
        ${points.map((value, index) => `<circle cx="${(index * stepX).toFixed(1)}" cy="${(30 - ((value - min) / span) * 26 - 2).toFixed(1)}" r="0.9" class="dot" />`).join('')}
      </svg>
      <div class="chart-foot">
        ${labels.map((label) => `<span>${esc(label)}</span>`).join('')}
        <span class="muted-text" style="margin-left:auto">末值 ${esc(points[points.length - 1])}${esc(unit)}</span>
      </div>
    </div>
  </div>`;
}

/** 环形：三段以内用 stroke-dasharray 画，不引依赖。 */
function blockDonut({ title, items }) {
  const total = items.reduce((sum, item) => sum + item.value, 0) || 1;
  const colors = ['#2f6df6', '#f0a32e', '#2f9e6b', '#8b95a1'];
  let offset = 0;
  const arcs = items.map((item, index) => {
    const length = (item.value / total) * 100;
    const arc = `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${colors[index % colors.length]}" stroke-width="6"
      stroke-dasharray="${length} ${100 - length}" stroke-dashoffset="${-offset}" transform="rotate(-90 21 21)" />`;
    offset += length;
    return arc;
  }).join('');
  return `
  <div class="ui-block">
    <div class="ui-head"><h4>${esc(title)}</h4></div>
    <div class="donut-wrap">
      <svg viewBox="0 0 42 42" class="donut">${arcs}<text x="21" y="22.5" text-anchor="middle" class="donut-total">${total}</text></svg>
      <ul class="legend">
        ${items.map((item, index) => `
          <li><i style="background:${colors[index % colors.length]}"></i><span>${esc(item.label)}</span><b>${item.value}</b></li>`).join('')}
      </ul>
    </div>
  </div>`;
}

            note: w.enabled ? '到 22:00 会自动整理一次，也可以现在就跑。' : '打开心跳后才会有队列。',
            actions: [{ label: '立即整理', kind: 'primary' }, { label: '调整范围', kind: 'ghost' }]
          }
        })
      ]
    };
  }
  return { text: '这个我还没有接到具体能力上——先按普通回答处理。', blocks: [] };
}

function renderBlock(block) { return block; }

function renderThread() {
  const picking = state.at?.step === 'prompt' || state.at?.step === 'share';
  const items = state.messages.map((message, index) => {
    const picked = picking && state.at.picks.includes(index);
    if (message.role === 'user') {
      const isCommand = message.commandKey;
      return `
      <div class="msg user ${picking ? 'pickable' : ''} ${picked ? 'picked' : ''}" data-msg-index="${index}" ${picking ? `data-pick-msg="${index}"` : ''}>
        ${picking ? `<span class="pick-box">${picked ? '✓' : ''}</span>` : ''}
        ${isCommand ? `<span class="chip">${esc(message.slash ?? '')}</span>` : ''}
        <div class="bubble">${esc(message.text)}</div>
      </div>`;
    }
    return `
    <div class="msg agent ${picking ? 'pickable' : ''} ${picked ? 'picked' : ''}" data-msg-index="${index}" ${picking ? `data-pick-msg="${index}"` : ''}>
      ${picking ? `<span class="pick-box">${picked ? '✓' : ''}</span>` : ''}
      ${message.text ? `<div class="bubble">${esc(message.text)}</div>` : ''}
      ${(message.blocks ?? []).map(renderBlock).join('')}
      <div class="msg-foot">${actsHtml('msg', index)}</div>
    </div>`;
  }).join('');

  const pending = state.pending
    ? `<div class="msg agent"><div class="thinking"><i></i><i></i><i></i><span>Agent 正在处理…</span></div></div>`
    : '';

  return `<div class="thread" id="thread">${items}${pending}</div>`;
}

/** 每个生成式 UI 块右上角挂同一组动作：复制这一块 / 这一块转 prompt。 */
function attachBlockActs() {
  document.querySelectorAll('#thread .ui-block, #thread details.tool').forEach((node, index) => {
    if (node.querySelector(':scope > .acts')) return;
    const holder = document.createElement('span');
    holder.className = 'acts block-acts';
    holder.innerHTML = `<button class="mini" data-copy-block="${index}" title="复制这一块">⧉</button>`;
    node.prepend(holder);
  });
}

function renderSlash() {
  const quick = slashMatches(state.slashQuery);
  const rest = skillMatches(state.slashQuery);
  const shell = state.variant === 'C' ? 'slash sheet' : 'slash';
  const conflicts = numConflicts();
  const query = String(state.slashQuery ?? '').replace(/^\//u, '').trim();
  return `
  <div class="${shell}" id="slash">
    <div class="slash-head">
      <span>${state.aliasing ? '直接改数字，改完点完成' : '按数字调用'}</span>
      <button class="link" data-alias-toggle="1">${state.aliasing ? '完成' : '自定义'}</button>
      ${state.variant === 'C' ? '<button class="mini" data-slash-close="1" style="float:right;line-height:1">关闭</button>' : ''}
    </div>
    <div class="${state.variant === 'C' ? 'sheet-body' : 'skill-scroll'}">
      ${quick.length ? `<div class="slash-group">数字快捷</div>` : ''}
      ${quick.map((item, index) => `
        <div class="slash-item ${index === state.slashIndex ? 'on' : ''}" data-slash="${esc(item.key)}">
          ${state.aliasing
            ? `<input class="num-input ${conflicts.has(item.key) ? 'conflict' : ''}" data-num-for="${esc(item.key)}" value="${numOf(item.key)}" maxlength="1" inputmode="numeric" />`
            : `<span class="num">${numOf(item.key)}</span>`}
          <span class="cmd">${esc(item.cmd)}</span>
          <span class="desc">${esc(item.desc)}</span>
          <span class="src ${esc(item.source)}">${esc(SOURCE_LABEL[item.source] ?? item.source)}</span>
        </div>`).join('')}
      ${rest.length ? `<div class="slash-group">全部技能 · ${rest.length}${query ? '（已过滤）' : ''}</div>` : ''}
      ${rest.map((skill) => `
        <div class="slash-item skill" data-skill="${esc(skill.id)}">
          <span class="num empty"></span>
          <span class="cmd">/${esc(skill.id)}</span>
          <span class="desc">${esc(skill.desc)}</span>
          <span class="src ${esc(skill.source)}">${esc(SOURCE_LABEL[skill.source] ?? skill.source)}</span>
        </div>`).join('')}
      ${quick.length + rest.length === 0 ? `<div class="slash-item"><span class="desc">没有匹配的命令或技能</span></div>` : ''}
    </div>
    ${state.aliasing ? '' : `<div class="slash-foot">↑↓ 或滚动看全部；点一行即调用 · Esc 关闭</div>`}
    ${conflicts.size > 0 ? `<div class="slash-warn">有两个命令用了同一个数字，按数字会命中排在前面的那个。</div>` : ''}
  </div>`;
}

/** 最常用的三条：空输入时出现在输入框上方，按数字就能执行；顺序跟别名一致。 */

/** 会话列表：搜索、置顶、重命名、删除二次确认，三个变体共用这一份。 */
function sessionRows() {
  const query = state.sessionQuery.trim().toLowerCase();
  const list = state.sessions
    .filter((item) => !query || item.title.toLowerCase().includes(query))
    .slice()
    .sort((a, b) => Number(b.pinned) - Number(a.pinned));
  if (list.length === 0) {
    return `<div class="pop-empty">${state.sessions.length === 0
      ? '还没有会话。在下面输入标题新建一个。'
      : '没有匹配的会话。'}</div>`;
  }
  return list.map((item) => {
    if (state.editingId === item.id) {
      return `
      <div class="pop-item editing">
        <input id="renameInput" value="${esc(item.title)}" />
        <button class="mini primary" data-rename-save="${esc(item.id)}">存</button>
        <button class="mini" data-rename-cancel="1">取消</button>
      </div>`;
    }
    if (state.confirmDeleteId === item.id) {
      return `
      <div class="pop-item confirming">
        <span class="t">
          <span class="name">删除「${esc(item.title)}」？</span>
          <span class="meta">这条会话的记录会一起消失，之后找不回来。</span>
        </span>
        <button class="mini danger" data-delete-confirm="${esc(item.id)}">删除</button>
        <button class="mini" data-delete-cancel="1">取消</button>
      </div>`;
    }
    return `
    <div class="pop-item ${item.id === state.sessionId ? 'on' : ''}" data-session="${esc(item.id)}">
      <span class="t">
        <span class="name">${item.pinned ? '<span class="pin">置顶</span>' : ''}${esc(item.title)}</span>
        <span class="meta">${esc(item.at)} · ${item.turns} 轮</span>
      </span>
      <span class="acts">
        <button class="mini" data-session-rename="${esc(item.id)}" title="重命名">✎</button>
        <button class="mini" data-session-pin="${esc(item.id)}" title="${item.pinned ? '取消置顶' : '置顶'}">${item.pinned ? '↓' : '↑'}</button>
        <button class="mini danger" data-session-delete="${esc(item.id)}" title="删除">删除</button>
      </span>
    </div>`;
  }).join('');
}

        <h4>写入范围</h4>
        <div class="cfg-row">
          <span class="cfg-label">自有目录</span>
          <span class="cfg-inline">
            <span class="tag ok">默认允许</span>
            <span class="muted-text"><code>&lt;配置根&gt;/</code>：快照、导出、经验、决策、变更队列</span>
          </span>
        </div>
        <div class="cfg-row">
          <span class="cfg-label">项目目录</span>
          <span class="cfg-inline">
            <span class="tag warn">需逐次确认</span>
            <span class="muted-text">只在你要求「同步文档到项目」时才写，写前评估风险</span>
          </span>
        </div>
        <div class="cfg-note">${icon('check', 'ok')}被观察仓库在正常运行时保持只读：不写文件、不改 git 索引</div>
