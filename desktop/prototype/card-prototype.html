      <button class="btn" data-settings-detect="1">重新探测</button>
      <button class="btn" data-settings-close="1">取消</button>
      <button class="btn primary" data-settings-save="1">保存</button>
    </div>
  </div>`;
}

function renderStatePanel() {  if (!state.showState) return '';
  const snapshot = {
    variant: state.variant,
    project: currentProject(),
    session: currentSession(),
    sessions: state.sessions.length,
    projects: state.projects.map((p) => `${p.name}(${p.kind})`),
    messages: state.messages.map((m) => m.role === 'user' ? `user: ${m.text}` : `agent: ${(m.blocks ?? []).length} 块`),
    pending: state.pending,
    popover: state.popover,
    drawer: state.drawer
  };
  return `<div class="state-panel" id="statePanel"><pre>${esc(JSON.stringify(snapshot, null, 2))}</pre></div>`;
}

function render() {
  card.className = `card v-${state.variant.toLowerCase()}`;
  const composerInThread = state.variant === 'B';
  card.innerHTML = `
    <div class="card-head">${renderHead()}</div>
    ${renderThread()}
    ${composerInThread ? renderComposer() : ''}
    ${composerInThread ? '<div style="flex:1 1 auto"></div>' : ''}
    ${renderPopover()}
    ${composerInThread ? '' : renderComposer()}
    ${state.variant === 'C' && state.slash ? renderSlash() : ''}
    ${renderAtOverlay()}
    ${renderProjectSwitchDialog()}
    ${renderSettings()}
    ${renderPromptSheet()}
    ${renderStatePanel()}
    <div class="toast" id="toast"></div>
  `;
  // 先挂块级动作条，再统一绑定：否则块上的按钮在绑定时还不存在。
  attachBlockActs();
  bind();
  const thread = document.getElementById('thread');
  if (thread) thread.scrollTop = thread.scrollHeight;
  const input = document.getElementById('input');
  if (input && document.activeElement !== input) input.focus({ preventScroll: true });
}

/* ────────────────────────────────────────────────────────────────
   交互
   ──────────────────────────────────────────────────────────────── */
let toastTimer = null;
function toast(text) {
  const node = document.getElementById('toast');
  if (!node) return;
  node.textContent = text;
  node.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('on'), 1600);
}

function closeLayers() {
  state.popover = null;
  state.drawer = null;
  state.addMode = '';
  state.slash = false;
  state.slashIndex = 0;
  state.sessionQuery = '';
  state.editingId = '';
  state.confirmDeleteId = '';
}

/** 重命名：Enter、点「存」、失焦都算确认；空标题当取消，不把会话改没名字。 */
function commitRename(id) {
  const input = document.getElementById('renameInput');
  const value = String(input?.value ?? '').trim();
  const target = state.sessions.find((s) => s.id === id);
  if (target && value) target.title = value;
  state.editingId = '';
  render();
}

/** 没有会话时先建一条：原型里不让「能发消息但没有会话」这种半截状态出现。 */
function ensureSession() {
  if (state.sessionId) return;
  const id = `s${Date.now()}`;
  state.sessions.unshift({ id, title: '新会话', at: '刚刚', turns: 0, pinned: false });
  state.sessionId = id;
}

/** 点一行普通技能：按技能调用，回一张「已调用」卡（原型不执行真实技能）。 */
function runSkill(id) {
  const skill = SKILLS.find((item) => item.id === id);
  if (!skill) return;
  ensureSession();
  state.messages.push({ role: 'user', text: `调用技能 /${id}`, slash: `/${id}`, commandKey: `skill:${id}` });
  state.draft = '';
  state.slash = false;
  state.pending = true;
  render();
  setTimeout(() => {
    state.pending = false;
    state.messages.push({
      role: 'agent',
      text: `已调用 /${id}（${skill.source}）。`,
      blocks: [
        blockKeyValue({
          title: skill.id,
          rows: [
            ['来源', skill.source === 'pstack' ? 'pstack 插件' : 'matt 技能'],
            ['说明', skill.desc],
            ['读取', '只读工具面：read / grep / find / ls'],
            ['执行', '原型不跑真实技能；这里只演示调用形状']
          ]
        })
      ]
    });
    render();
  }, 420);
}

function runCommand(key, slashText) {
  ensureSession();
  const item = SLASH.find((s) => s.key === key) ?? SLASH[0];
  state.messages.push({ role: 'user', text: item.say ?? item.desc, slash: item.cmd, commandKey: key });
  state.draft = '';
  state.slash = false;
  state.pending = true;
  render();
  setTimeout(() => {
    const reply = replyFor(key);
    state.pending = false;
    // 一条命令可以回多段：先给结论，再给明细，比把十种块塞进一条消息好读。
    const list = reply.messages ?? [{ text: reply.text, blocks: reply.blocks ?? [] }];
    for (const message of list) {
      state.messages.push({ role: 'agent', text: message.text ?? '', blocks: message.blocks ?? [] });
    }
    render();
  }, 520);
}

function sendFreeText(text) {
  const trimmed = text.trim();
  if (!trimmed && !state.refs.length) return;
  ensureSession();
  const refs = state.refs.slice();
  const refText = refs.length ? ` ${refs.map((ref) => `@@${ref.label}`).join(' ')}` : '';
  state.messages.push({ role: 'user', text: `${trimmed || '（无指令）'}${refText}` });
  state.draft = '';
  state.refs = [];
  state.pending = true;
  render();
  setTimeout(() => {
    state.pending = false;
    if (refs.some((ref) => ref.kind === 'session')) {
      // 关联了会话：先给 prompt，再按 HITL 问一句「具体要找什么」。
      const session = refs.find((ref) => ref.kind === 'session');
      state.messages.push({
        role: 'agent',
        text: '收好了，下面是拼出来的 prompt。另外——这段会话我没有整段读，先去里面找你要的东西。',
        blocks: [blockCode({ title: '生成的 prompt', code: composePrompt(trimmed, refs), lang: 'md' })]
      });
      state.messages.push({
        role: 'agent',
        text: '',
        blocks: [blockAsk({
          question: `要我在 ${session.label} 里找什么？`,
          why: '那段有 28 轮，整段读会挤掉别的上下文；给我一个方向就够。',
          tried: ['按标题匹配到 1 段会话', '没有自动展开正文'],
          options: ['结论与决策', '实现细节', '失败与回滚']
        })]
      });
    } else if (refs.length) {
      state.messages.push({
        role: 'agent',
        text: `按你的指令和 ${refs.length} 项引用收成了一版 prompt：`,
        blocks: [blockCode({ title: '生成的 prompt', code: composePrompt(trimmed, refs), lang: 'md' })]
      });
    } else {
      state.messages.push({
        role: 'agent',
        text: '（原型）这里会走真正的 Agent。要试生成式回复，用 /记忆、/项目库、/扫会话、/差异、/发布、/灵感；要用数字直接调，打 /1 到 /9。',
        blocks: []
      });
    }
    render();
  }, 420);
}

function bind() {
  const on = (selector, handler) => {
    const node = document.querySelector(selector);
    if (node) node.addEventListener('click', handler);
  };

  on('#pillSession', () => {
    const already = state.variant === 'B' ? state.drawer === 'session' : state.popover === 'session';
    closeLayers();
    if (!already) { if (state.variant === 'B') state.drawer = 'session'; else state.popover = 'session'; }
    render();
  });

  on('#pillProject', () => {
    const already = state.variant === 'B' ? state.drawer === 'project' : state.popover === 'project';
    closeLayers();
    if (!already) { if (state.variant === 'B') state.drawer = 'project'; else state.popover = 'project'; }
    render();
  });

  on('#stateBtn', () => { state.showState = !state.showState; render(); });

  document.querySelectorAll('[data-session]').forEach((node) => {
    node.addEventListener('click', () => {
      state.sessionId = node.dataset.session;
      const session = currentSession();
      state.messages = [{ role: 'agent', text: session ? `已切到「${session.title}」。` : '这条会话已经删掉了。' }];
      closeLayers();
      render();
    });
  });

  document.querySelectorAll('[data-session-rename]').forEach((node) => {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      state.editingId = node.dataset.sessionRename;
      state.confirmDeleteId = '';
      render();
      const input = document.getElementById('renameInput');
      if (input) { input.focus(); input.select(); }
    });
  });

  document.querySelectorAll('[data-session-pin]').forEach((node) => {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      const target = state.sessions.find((s) => s.id === node.dataset.sessionPin);
      if (target) target.pinned = !target.pinned;
      render();
    });
  });

  document.querySelectorAll('[data-session-delete]').forEach((node) => {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      state.confirmDeleteId = node.dataset.sessionDelete;
      state.editingId = '';
      render();
    });
  });

  document.querySelectorAll('[data-delete-confirm]').forEach((node) => {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      const id = node.dataset.deleteConfirm;
      state.sessions = state.sessions.filter((s) => s.id !== id);
      if (state.sessionId === id) {
        // 删掉的正是当前会话：落到第一条；一条都不剩就让卡片刻意空着，不假装还有会话。
        state.sessionId = state.sessions[0]?.id ?? '';
        state.messages = state.sessionId
          ? [{ role: 'agent', text: `已切到「${currentSession().title}」。` }]
          : [];
      }
      closeLayers();
      render();
      toast('会话已删除');
    });
  });

  document.querySelectorAll('[data-delete-cancel], [data-rename-cancel]').forEach((node) => {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      state.confirmDeleteId = '';
      state.editingId = '';
      render();
    });
  });

  document.querySelectorAll('[data-rename-save]').forEach((node) => {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      commitRename(node.dataset.renameSave);
    });
  });

  const search = document.getElementById('sessionSearch');
  if (search) {
    search.addEventListener('input', () => {
      state.sessionQuery = search.value;
      const list = document.querySelector('#popover .pop-list, .drawer .pop-list');
      if (list) list.innerHTML = sessionRows();
      else render();
    });
    search.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      state.sessionQuery = '';
      render();
    });
  }

  const renameInput = document.getElementById('renameInput');
  if (renameInput) {
    renameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); commitRename(state.editingId); }
      if (event.key === 'Escape') { event.preventDefault(); state.editingId = ''; render(); }
    });
    renameInput.addEventListener('blur', () => {
      // 失焦即保存：重命名没有「半途」状态，离开就当作确认。
      if (state.editingId && document.getElementById('renameInput')) commitRename(state.editingId);
    });
  }

  document.querySelectorAll('[data-project]').forEach((node) => {
    node.addEventListener('click', () => {
      const target = node.dataset.project;
      if (target === state.projectId) { closeLayers(); render(); return; }
      // 换项目会改变后续读取与写入的落点：先确认，再切。
      state.popover = null;
      state.drawer = null;
      state.dialog = { kind: 'project-switch', targetId: target };
      render();
    });
  });

  document.querySelectorAll('[data-dialog-cancel]').forEach((node) => {
    node.addEventListener('click', () => { state.dialog = null; render(); });
  });

  document.querySelectorAll('[data-dialog-switch]').forEach((node) => {
    node.addEventListener('click', () => {
      const mode = node.dataset.dialogSwitch;
      const target = state.dialog?.targetId ?? '';
      const from = projectLabel();
      const to = state.projects.find((p) => p.id === target);
      const toLabel = to?.name ?? (target ? '目标项目' : '全局');
      state.dialog = null;
      if (mode === 'new') {
        const id = `s${Date.now()}`;
        state.sessions.unshift({ id, title: `${toLabel} · 新会话`, at: '刚刚', turns: 0, pinned: false });
        state.sessionId = id;
        state.messages = [{ role: 'agent', text: `新会话，已绑定 ${toLabel}。` }];
      } else {
        const session = currentSession();
        if (session) session.crossProject = true;
        state.messages.push({
          role: 'agent',
          text: `已切到 ${toLabel}。这条会话的历史仍属于 ${from}；之后的读取与写入按 ${toLabel} 算。`
        });
      }
      state.projectId = target;
      closeLayers();
      render();
      toast(`视图切到 ${projectLabel()}；交办目标不受影响`);
    });
  });

  document.querySelectorAll('[data-at-method]').forEach((node) => {
    node.addEventListener('click', () => openAtMethod(node.dataset.atMethod));
  });

  document.querySelectorAll('[data-at-cancel]').forEach((node) => {
    node.addEventListener('click', () => { state.at = null; render(); focusEnd(); });
  });

  // 生成 prompt：直接点对话流里的消息来勾选（提问与回复都算），卡片只负责计数与指令。
  document.querySelectorAll('[data-pick-msg]').forEach((node) => {
    node.addEventListener('click', (event) => {
      if (event.target.closest('button')) return;
      const index = Number(node.dataset.pickMsg);
      const picks = state.at.picks;
      const at = picks.indexOf(index);
      if (at >= 0) picks.splice(at, 1); else picks.push(index);
      render();
    });
  });

  const instruction = document.getElementById('atInstruction');
  if (instruction) {
    instruction.addEventListener('input', () => { state.at.instruction = instruction.value; });
  }

  document.querySelectorAll('[data-at-generate]').forEach((node) => {
    node.addEventListener('click', () => {
      const at = state.at;
      const picks = [...at.picks].sort((a, b) => a - b);
      const instructionText = String(at.instruction ?? '').trim();
      const pickables = atPickables();
      const refs = picks.map((index) => ({
        kind: 'message',
        id: String(index),
        label: pickables.find((item) => item.index === index)?.label ?? `第 ${index + 1} 条`
      }));
      state.at = null;
      state.messages.push({
        role: 'user',
        text: `生成 prompt：${instructionText || '（无指令）'}${refs.length ? ` · 引用 ${refs.length} 条` : ''}`
      });
      render();
      setTimeout(() => {
        state.messages.push({
          role: 'agent',
          text: '收好了，下面是拼出来的 prompt：',
          blocks: [blockCode({ title: '生成的 prompt', code: composePrompt(instructionText, refs), lang: 'md' })]
        });
        render();
      }, 260);
    });
  });

  document.querySelectorAll('[data-at-open]').forEach((node) => {
    node.addEventListener('click', () => {
      const id = node.dataset.atOpen;
      state.at.openId = state.at.openId === id ? '' : id;
      render();
    });
  });

  document.querySelectorAll('[data-at-auto]').forEach((node) => {
    node.addEventListener('click', () => {
      const id = node.dataset.atAuto;
      state.at.auto[id] = !state.at.auto[id];
      if (state.at.auto[id]) state.at.mats[id] = [];
      render();
    });
  });

  document.querySelectorAll('[data-at-mat]').forEach((node) => {
    node.addEventListener('click', () => {
      if (node.disabled) return;
      const id = node.dataset.for;
      const mats = state.at.mats[id] ?? [];
      const at = mats.indexOf(node.dataset.atMat);
      if (at >= 0) mats.splice(at, 1); else mats.push(node.dataset.atMat);
      state.at.mats[id] = mats;
      render();
    });
  });

  document.querySelectorAll('[data-import-source]').forEach((node) => {
    node.addEventListener('click', () => {
      state.at.source = node.dataset.importSource;
      state.at.picked = [];
      render();
    });
  });

  document.querySelectorAll('[data-import-pick]').forEach((node) => {
    node.addEventListener('click', () => {
      const id = node.dataset.importPick;
      const picked = state.at.picked;
      const at = picked.indexOf(id);
      if (at >= 0) picked.splice(at, 1); else picked.push(id);
      render();
    });
  });

  document.querySelectorAll('[data-import-confirm]').forEach((node) => {
    node.addEventListener('click', () => {
      const at = state.at;
      const sourceLabel = at.source === 'codex' ? 'Codex' : 'OpenCode';
      for (const id of at.picked) {
        const custom = String(id).startsWith('custom:');
        const item = custom ? null : (IMPORT_SOURCES[at.source] ?? []).find((s) => s.id === id);
        const hint = String(at.custom?.[id] ?? '').trim();
        const ref = custom || !item
          ? {
            kind: 'session',
            id: `${at.source}:${id}`,
            label: hint || '自定义指向',
            summary: '来源未确认 · 需要时检索'
          }
          : {
            kind: 'session',
            id: `${at.source}:${id}`,
            label: `${sourceLabel} · ${item.title}`,
            summary: `${item.turns} 轮 · ${item.size}`
          };
        if (custom || !item) ref.loose = true;
        const existing = state.refs.findIndex((r) => refKey(r) === refKey(ref));
        if (existing >= 0) state.refs[existing] = ref; else state.refs.push(ref);
      }
      state.at = null;
      render();
      focusEnd();
      toast(`已关联 ${at.picked.length} 段会话；Agent 需要时去里面找`);
    });
  });

  const sessionQuery = document.getElementById('sessionQuery');
  if (sessionQuery) {
    sessionQuery.addEventListener('input', () => { state.at.query = sessionQuery.value; });
    sessionQuery.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      addCustomSession();
    });
  }

  document.querySelectorAll('[data-session-add]').forEach((node) => {
    node.addEventListener('click', addCustomSession);
  });

  document.querySelectorAll('[data-share-send]').forEach((node) => {
    node.addEventListener('click', () => {
      const at = state.at;
      const picks = [...at.picks].sort((a, b) => a - b);
      const pickables = atPickables();
      const lines = picks.map((index) => {
        const item = pickables.find((entry) => entry.index === index);
        return `- ${item?.label ?? `第 ${index + 1} 条`}：${String(item?.message.text ?? '').replace(/\s+/gu, ' ').trim()}`;
      });
      state.at = null;
      state.messages.push({ role: 'user', text: `分享到飞书 · ${picks.length} 条` });
      render();
      setTimeout(() => {
        state.messages.push({
          role: 'agent',
          text: '已发到飞书（原型不真发，下面是要发出去的内容）。',
          blocks: [
            blockCard({
              title: '分享到飞书', badge: '已发送',
              sub: `${currentSession()?.title ?? '会话'} · ${picks.length} 条 · 原文未改写`,
              sections: [{
                label: '内容', count: `${picks.length} 条`,
                items: picks.map((index) => {
                  const item = pickables.find((entry) => entry.index === index);
                  return {
                    title: `${item?.label ?? ''}：${String(item?.message.text ?? '').slice(0, 40)}`,
                    tags: [{ text: '文本卡片' }]
                  };
                })
              }],
              foot: {
                note: '首版只发文本；发图需要先上传拿 image_key，单独做。',
                actions: [{ label: '在飞书打开', kind: 'ghost' }]
              }
            })
          ]
        });
        render();
      }, 320);
      // 保留一份便于核对：真实实现把这段交给 observer 的单一 webhook
      void lines;
    });
  });

  document.querySelectorAll('[data-at-confirm]').forEach((node) => {
    node.addEventListener('click', () => {
      const at = state.at;
      const ids = state.projects
        .map((p) => p.id)
        .filter((id) => at.auto[id] === true || (at.mats[id] ?? []).length > 0);
      if (!ids.length) { toast('先选一个项目，或让它自己找'); return; }
      for (const id of ids) {
        const project = state.projects.find((p) => p.id === id);
        if (!project) continue;
        const auto = at.auto[id] === true;
        const mats = at.mats[id] ?? [];
        const summary = auto
          ? '由 Agent 自行决定'
          : mats.map((key) => MATS.find((m) => m.key === key)?.label ?? key).join('、');
        const existing = state.refs.findIndex((ref) => refKey(ref) === `project:${id}`);
        const ref = { kind: 'project', id, label: project.name, summary };
        if (existing >= 0) state.refs[existing] = ref; else state.refs.push(ref);
      }
      state.at = null;
      render();
      focusEnd();
      toast(`已关联 ${ids.length} 个项目，资料会进你的 prompt`);
    });
  });

  document.querySelectorAll('[data-ask-opt]').forEach((node) => {
    node.addEventListener('click', () => {
      const choice = node.dataset.askOpt;
      const kind = node.closest('[data-ask]')?.dataset.askKind ?? '';
      state.messages.push({ role: 'user', text: choice });
      render();
      setTimeout(() => {
        if (kind === 'sync-conflict') {
          state.messages.push({
            role: 'agent',
            text: '按你选的解了，推送完成。',
            blocks: [blockKeyValue({
              title: '冲突处理',
              rows: [
                ['选择', choice],
                ['结果提交', 'd4e5f6a resolve · 1 篇'],
                ['记录', '决策进会话，不进文档']
              ]
            })]

      const atMatch = input.value.match(/@@([^\s@]*)$/u);
      if (atMatch && !slashOpen) {
        openAtMenu();
        focusEnd();
        return;

      // 打开斜杠面板时先收起弹窗/抽屉：三个浮层不该同时压在一起。
      if (slashOpen && (state.popover || state.drawer)) {

        fresh.innerHTML = renderSlash();
        slashNode.replaceWith(fresh.firstElementChild);
        bindSlash();
      } else {
        render();
      }
    });

    input.addEventListener('keydown', (event) => {
      // 弹窗打开时，Enter 交给弹窗里的按钮，不误发消息。
      if (state.at) {
        if (event.key === 'Escape') {
          event.preventDefault();
          state.at = null;
          render();
          focusEnd();
        }
        return;
      }
      if (state.slash) {
        const list = slashMatches(state.slashQuery);
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          state.slashIndex = (state.slashIndex + 1) % Math.max(list.length, 1);
          render();
          return;
        }
        if (event.key === 'ArrowUp') {
          event.preventDefault();
          state.slashIndex = (state.slashIndex - 1 + list.length) % Math.max(list.length, 1);
          render();
          return;
        }
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          const chosen = list[state.slashIndex];
          if (chosen) runCommand(chosen.key, chosen.cmd);
          return;
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          state.slash = false;
          render();
          return;
        }
      }
      if (event.key === 'Enter' && !event.shiftKey && !state.slash) {
        event.preventDefault();
        sendFreeText(input.value);
      }
    });
  }

  on('#send', () => {
    const value = document.getElementById('input')?.value ?? '';
    if (state.slash) {

/** 复制 / 转 prompt / 导出 的绑定。每次重渲染后重新挂一次。 */
function bindCopyAndPrompt() {
  const blocks = () => [...document.querySelectorAll('#thread .ui-block, #thread details.tool')];

  document.querySelectorAll('[data-copy-msg]').forEach((node) => {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      void copyText(markdownOfMessage(Number(node.dataset.copyMsg)), '消息');
    });
  });

  document.querySelectorAll('[data-copy-block]').forEach((node) => {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      const target = blocks()[Number(node.dataset.copyBlock)];
      void copyText(mdOfBlock(target), '这一块');
    });
  });

  // 划选一段文字仍可转 prompt；悬停图标只做复制。
  const thread = document.getElementById('thread');
  if (thread) {
    thread.addEventListener('mouseup', () => {
      const selection = String(window.getSelection?.() ?? '').trim();
      if (selection.length < 8 || state.prompt) return;
      state.prompt = { source: '选中内容', text: promptOf(selection) };
      render();
    });
  }

  document.querySelectorAll('[data-prompt-close]').forEach((node) => {
    node.addEventListener('click', () => { state.prompt = null; render(); });
  });

  document.querySelectorAll('[data-prompt-copy]').forEach((node) => {
    node.addEventListener('click', () => {
      const value = document.getElementById('promptText')?.value ?? '';
      void copyText(value, 'prompt');
    });
  });

  document.querySelectorAll('[data-prompt-input]').forEach((node) => {
    node.addEventListener('click', () => {
      const value = document.getElementById('promptText')?.value ?? '';
      state.draft = value;
      state.prompt = null;
      render();
      const input = document.getElementById('input');
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      toast('已回填到输入框，改完直接发');
    });
  });

  document.getElementById('exportConv')?.addEventListener('click', () => {
    const md = markdownOfConversation();
    const session = currentSession();
    const stamp = '2026-11-25-1941';
    void copyText(md, '会话'); // 原型不写文件：复制一份，同时把真实路径说清楚
    toast(`原型不写文件；真实实现落到 exports/conversations/${stamp}-${(session?.title ?? 'session').slice(0, 12)}.md`);
  });
}

function bindSlash() {
  document.querySelectorAll('[data-slash]').forEach((node) => {
    node.addEventListener('click', (event) => {
      // 改数字时可点整行，但不该顺手把命令执行掉。
      if (state.aliasing || event.target.closest('[data-num-for]')) return;
      const item = SLASH.find((s) => s.key === node.dataset.slash);
      if (item) runCommand(item.key, item.cmd);
    });
  });
  document.querySelectorAll('[data-skill]').forEach((node) => {
    node.addEventListener('click', () => runSkill(node.dataset.skill));
  });
  document.querySelectorAll('[data-slash-close]').forEach((node) => {
    node.addEventListener('click', () => {
      state.slash = false;
      state.draft = '';
      render();
    });
  });
  document.querySelectorAll('[data-alias-toggle]').forEach((node) => {
    node.addEventListener('click', () => {
      state.aliasing = !state.aliasing;
      render();
      if (state.aliasing) document.querySelector('[data-num-for]')?.focus();
    });
  });
  document.querySelectorAll('[data-num-for]').forEach((node) => {
    node.addEventListener('input', () => {
      // 就地生效、不重渲染：否则每敲一个数字输入框就丢焦点。
      const value = node.value.replace(/\D/gu, '').slice(0, 1);
      node.value = value;
      state.nums[node.dataset.numFor] = value === '' ? undefined : value;
      const conflicts = numConflicts();
      document.querySelectorAll('[data-num-for]').forEach((other) => {
        other.classList.toggle('conflict', conflicts.has(other.dataset.numFor));
      });
    });
  });
}

/* ── 变体切换 ──────────────────────────────────────────────────── */
const label = document.getElementById('variantLabel');
const keys = document.getElementById('variantKeys');

function setVariant(next) {
  state.variant = next;
  closeLayers();
  const url = new URL(location.href);
  url.searchParams.set('variant', next);
  history.replaceState(null, '', url);
  label.textContent = VARIANTS[next].name;
  keys.querySelectorAll('span').forEach((node) => node.classList.toggle('on', node.dataset.variant === next));
  render();
}

keys.innerHTML = Object.keys(VARIANTS).map((key) => `<span data-variant="${key}">${key}</span>`).join('');
keys.querySelectorAll('span').forEach((node) => {
  node.addEventListener('click', () => setVariant(node.dataset.variant));
});

const cycle = (step) => {
  const all = Object.keys(VARIANTS);
  const index = all.indexOf(state.variant);
  setVariant(all[(index + step + all.length) % all.length]);
};

document.getElementById('prev').addEventListener('click', () => cycle(-1));
document.getElementById('next').addEventListener('click', () => cycle(1));

document.addEventListener('keydown', (event) => {
  const tag = document.activeElement?.tagName?.toLowerCase();
  if (tag === 'input' || tag === 'textarea' || document.activeElement?.isContentEditable) return;
  if (event.key === 'ArrowLeft') cycle(-1);
  if (event.key === 'ArrowRight') cycle(1);
});

/* 启动：URL 里的 variant 优先，其次 A。 */
const initial = (new URL(location.href).searchParams.get('variant') ?? 'A').toUpperCase();
setVariant(VARIANTS[initial] ? initial : 'A');
</script>
