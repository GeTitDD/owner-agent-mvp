<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owner</title>
  <link rel="stylesheet" href="main-view.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <span>Owner</span>
    </div>
    <select id="projectSelect" aria-label="项目"></select>
    <div class="topbar-actions">
      <span id="statusText" class="status">同步中…</span>
      <button id="addProjectButton" type="button" class="ghost">添加项目</button>
      <button id="refreshButton" type="button" class="ghost">刷新</button>
    </div>
  </header>

  <main class="layout">
    <section id="emptyHint" class="hint" hidden>
      <h2>还没有项目</h2>
      <p>点右上角「添加项目」，填一个本机目录即可。所有数据保存在插件自己的目录里。</p>
    </section>

    <section id="addProjectCard" class="card" hidden>
      <h3>添加项目</h3>
      <div class="add-row">
        <input id="projectPath" type="text" placeholder="D:\path\to\project" spellcheck="false" />
        <button id="projectAdd" type="button" class="primary">添加</button>
        <button id="projectCancel" type="button" class="ghost">取消</button>
      </div>
      <div id="addProjectError" class="error small" hidden></div>
    </section>

    <section id="nextActionCard" class="card action" hidden></section>

    <section class="grid">
      <article class="card">
        <div class="card-head">
          <h3>项目画像</h3>
          <button id="briefRefresh" type="button" class="ghost small">重新扫描</button>
        </div>
        <div id="briefBody" class="body muted">正在读取…</div>
      </article>

      <article class="card">
        <div class="card-head">
          <h3>想法</h3>
        </div>
        <div class="add-row">
          <input id="ideaInput" type="text" maxlength="300" placeholder="记一条改进想法…" />
          <button id="ideaAdd" type="button" class="primary">记下</button>
        </div>
        <div id="ideaList" class="list"></div>
      </article>

      <article class="card">
        <div class="card-head">
          <h3>知识</h3>
          <span id="knowledgeCount" class="muted small"></span>
        </div>
        <div id="knowledgeBody" class="body muted">正在读取…</div>
        <div class="add-row">
          <input id="knowledgeInput" type="text" maxlength="200" placeholder="记一条项目知识…" />
          <button id="knowledgeAdd" type="button" class="primary">记下</button>
        </div>
        <div id="knowledgeList" class="list"></div>
      </article>

      <article class="card">
        <div class="card-head">
          <h3>依赖图</h3>
          <span id="diagramBadge" class="muted small"></span>
        </div>
        <div id="diagramBody" class="body muted">还没有生成依赖图。</div>
        <div id="diagramList" class="chips"></div>
        <div class="add-row">
          <button id="diagramScan" type="button" class="primary">扫描依赖</button>
          <button id="diagramCopy" type="button" class="ghost">复制 Mermaid</button>
        </div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="bridge.js"></script>
  <script src="main-view.js"></script>
</body>
</html>
