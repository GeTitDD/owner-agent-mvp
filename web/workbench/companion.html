<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Owner Companion</title><link rel="stylesheet" href="/companion.css"/><script src="/companion.js" defer></script></head><body>
<div class="pet-shell">
  <button id="pet" title="Owner Agent" aria-label="展开 Owner Agent"><span class="pet-face"><i></i><i></i><b>◡</b></span><span class="pet-sparkle">✦</span></button>
  <div id="panel" hidden>
    <div class="header"><span><strong>Owner Agent</strong><small>个人项目与知识管家</small></span><div><button id="openWorkbench" title="打开知识工作台">▣</button><button id="collapse" title="收起">−</button></div></div>
    <div id="overview" class="overview">正在读取本地项目状态…</div>
    <div id="messages" class="messages"><div class="msg">你好，我可以帮你查看项目进展、阻塞和知识建议。平时不需要模型持续运行。</div></div>
    <form id="chat"><input id="query" required maxlength="1200" placeholder="问问我：现在有哪些阻塞？" autocomplete="off"/><button type="submit">➤</button></form>
  </div>
</div>
</body></html>
